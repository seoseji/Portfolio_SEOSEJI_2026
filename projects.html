<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEOSEJI Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 실무(#work) · AI(#ai) 프로젝트 페이지
   상단 바 → 큰 타이틀 + 소개 → 목차(스크롤하면 상단 바 밑에 붙고 어두워짐)
   → 매체별 구간(왼쪽: 매체 이름, 오른쪽: 작업물 · TOOL · TIME · POINT) → 다음 페이지 링크.
   인트로와 같은 색 · 글꼴, 밝은 테마 하나만 사용 */
:root{
  --bg:#fbfbfb;--fg:#1e212d;--cursor:#ffa73e;--cream:#f9f3cf;
  --muted:rgba(30,33,45,.56);--line:rgba(30,33,45,.14);--soft:#f1f1ef;
  --display:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px),2.6vw);--gxr:max(16px,env(safe-area-inset-right,0px),2.6vw);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:var(--cream)}
img,video{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
figure{margin:0;min-width:0}
.gx{padding-left:var(--gx);padding-right:var(--gxr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a:focus-visible,button:focus-visible{outline:2px solid var(--cursor);outline-offset:3px}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,251,251,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px;border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.home{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.16em;text-decoration:none;white-space:nowrap}
.switch{display:flex;gap:clamp(12px,2vw,28px);font-size:13.5px}
.switch a{text-decoration:none;color:var(--muted);position:relative;padding:2px 0;transition:color .2s}
.switch a.on,.switch a:hover{color:var(--fg)}
.switch a.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1.5px;background:var(--fg)}

/* ---------- 타이틀 ---------- */
.hero{display:grid;grid-template-columns:1fr minmax(0,330px);align-items:end;gap:24px 48px;padding-block:clamp(56px,11vh,120px) clamp(40px,7vh,72px)}
.title{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(48px,9.6vw,158px);line-height:.84;letter-spacing:.005em;margin:0;white-space:nowrap}
.lead{margin:0 0 .5em;font-size:15px;line-height:1.6;color:rgba(30,33,45,.8);text-wrap:pretty}

/* ---------- 목차: 상단 바(--tbH) 밑에 붙음, 붙으면 .stuck(어두운 배경), 보고 있는 매체는 .on ---------- */
.index{position:sticky;top:calc(var(--tbH,54px) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);border-top:1px solid var(--fg);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;margin-inline:calc(-1 * var(--gx)) calc(-1 * var(--gxr));padding-inline:var(--gx) var(--gxr);
  transition:background-color .3s,border-color .3s}
.index a{display:flex;gap:10px;align-items:baseline;padding:14px 0;white-space:nowrap;text-decoration:none;font-size:15px;font-weight:500;color:var(--muted);transition:padding .25s,color .25s}
.index a span{font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.index a:hover{padding-left:6px}
.index a.on,.index a:hover{color:var(--fg)}
.index a.on span{color:var(--cursor)}
.index.stuck{background:rgba(30,33,45,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top-color:transparent;border-bottom-color:transparent}
.index.stuck a{color:rgba(251,251,251,.62)}
.index.stuck a span{color:rgba(251,251,251,.42)}
.index.stuck a.on,.index.stuck a:hover{color:var(--bg)}
.index.stuck a.on span{color:var(--cursor)}

/* ---------- 매체 구간: 왼쪽 이름(붙어서 따라옴) · 오른쪽 작업물 ---------- */
.medium{display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr);gap:28px clamp(24px,4vw,64px);padding-block:clamp(56px,9vh,96px) 8px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--tbH,54px) + var(--ixH,50px))}
.m-label{align-self:start;position:sticky;top:calc(var(--tbH,54px) + var(--ixH,50px) + 24px + env(safe-area-inset-top,0px))}
.m-en{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:0}
.m-label h2{font-size:clamp(34px,3.4vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:4px 0 0 -.05em}
.m-label p{margin:14px 0 0;color:var(--muted);font-size:14.5px;word-break:keep-all}
.works{min-width:0}
.work{padding-bottom:clamp(48px,7vh,80px)}
.work+.work{padding-top:clamp(40px,6vh,64px);border-top:1px solid var(--line)}
.work.center .g,.work.center .vid,.work.center .long{margin-inline:auto}
.work.center .long-hint{text-align:center}
.w-head{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.w-head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2;flex:none;max-width:80%}

/* TOOL · TIME · POINT (TIME이 없으면 .no-time 두 칸) */
.spec{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.7fr) minmax(0,2.4fr);gap:16px 28px;margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.spec.no-time{grid-template-columns:minmax(0,1.1fr) minmax(0,3.1fr)}
.spec div{min-width:0}
.spec dt{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.spec dd{margin:0;font-size:14.5px;line-height:1.6}

/* TOOL 공식 로고 아이콘: 마우스를 올리면(휴대폰은 누르면) 이름 */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:2px}
.tic{width:28px;height:28px;display:grid;place-items:center;position:relative;flex:none;cursor:default}
.tic img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}
.tic:hover img{transform:translateY(-2px)}
.tic::after{content:attr(data-name);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);white-space:nowrap;background:var(--fg);color:var(--bg);
  font-family:var(--body);font-weight:500;font-size:12px;line-height:1.5;padding:3px 8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
.tic:hover::after,.tic:focus-visible::after,.tic.show::after{opacity:1;transform:translate(-50%,0)}
.tic:focus-visible{outline:2px solid var(--cursor);outline-offset:3px}

/* ---------- 갤러리 ---------- */
.g{display:grid;gap:clamp(8px,1vw,14px)}
.g.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g.c8{grid-template-columns:repeat(8,minmax(0,1fr));align-items:end}
.g.end{align-items:end}
.g .full{grid-column:1/-1}
.zoom{display:block;width:100%;padding:0;border:0;background:var(--soft);cursor:zoom-in;overflow:hidden;position:relative}
.zoom img{width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.zoom:hover img{transform:scale(1.025)}
.zoom:focus-visible{outline:2px solid var(--cursor);outline-offset:3px}
.cap{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.crop45 img{aspect-ratio:4/5;object-fit:cover}
.crop11 img{aspect-ratio:1;object-fit:cover}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;gap:clamp(8px,1vw,14px);align-items:flex-start}
.row figure{flex:var(--r) 1 0}
.minis{grid-template-columns:repeat(2,minmax(0,280px));justify-content:center}
.vid{background:#000}
.vid video{width:100%;height:auto}
.vid.vert{max-width:380px}
/* 긴 이미지(상세페이지): 상자 안에서 위아래 스크롤 */
.long{width:min(400px,100%);height:min(680px,78vh);overflow-y:auto;border:1px solid var(--line);background:var(--soft);position:relative;overscroll-behavior:contain}
.long .inner{position:relative}
.long .inner>img{width:100%;height:auto}
.long .gif{position:absolute;object-fit:cover}
.long-hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,360px));justify-content:center;gap:clamp(14px,2vw,28px)}
.dgrid+.long-hint{text-align:center}
.dgrid .long{width:100%}

/* ---------- 다음 페이지 ---------- */
.next{display:flex;justify-content:space-between;align-items:end;gap:24px;padding-block:clamp(64px,12vh,140px) clamp(40px,6vh,64px)}
.next a{text-decoration:none;display:block}
.next small{display:block;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.next .big{font-family:var(--display);text-transform:uppercase;font-size:clamp(36px,6vw,96px);line-height:.9;letter-spacing:-.04em;transition:letter-spacing .4s}
.next a:hover .big{letter-spacing:-.02em}
.next .back{font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap}
.next .back:hover{color:var(--fg)}

/* ---------- 크게 보기 ---------- */
#lb[hidden]{display:none}
#lb{position:fixed;inset:0;z-index:50;background:rgba(251,251,251,.97);display:grid;place-items:center;padding:clamp(16px,4vw,56px);cursor:zoom-out}
#lb img{max-height:calc(100vh - 2*clamp(16px,4vw,56px));width:auto;max-width:100%;object-fit:contain;box-shadow:0 20px 60px rgba(30,33,45,.12)}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(var(--gxr));border:0;background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;cursor:pointer}

/* ---------- 커서 (점과 테두리만, 마우스 기기만) ---------- */
.cur,.ring{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%;opacity:0}
.cur{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--cursor)}
.ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--cursor);transition:width .25s,height .25s,margin .25s}
.ring.big{width:58px;height:58px;margin:-29px 0 0 -29px}
@media (hover:hover) and (pointer:fine){html,a,button,.zoom{cursor:none}.cur,.ring{opacity:1}}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .medium{grid-template-columns:1fr}
  .m-label{position:static}
  .m-label p{max-width:none}
  .index{display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;gap:22px}
  .index::-webkit-scrollbar{display:none}
  .index a{flex:0 0 auto;padding:12px 0;font-size:14px;white-space:nowrap}
  .g.c6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g.c8{grid-template-columns:repeat(4,minmax(0,1fr))}
  .spec,.spec.no-time{grid-template-columns:1fr 1fr}
  .spec .pt{grid-column:1/-1}
}
@media (max-width:560px){
  .switch{font-size:12.5px}
  .title{font-size:min(48px,10.8vw)}
  .g.c3,.g.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g.c2.flyers,.g.c2.cards,.g.c2.stickers{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .row{flex-wrap:wrap}.row figure{flex-basis:100%}
  .next{flex-direction:column;align-items:flex-start}
}
</style>
</head>

  site:it=>`<div class="g c2">${it.slides.map((s,i)=>zoomButton(s,`롤링배너 ${i+1}`)).join('')}</div>`,
  popup:it=>`<div class="g c3">${it.slides.map((s,i)=>zoomButton(s,`팝업배너 ${i+1}`)).join('')}</div>`,
  flyers:it=>`<div class="g c2 flyers">${it.flyers.map(x=>`<figure class="${x.cls==='wide'?'full':''}"><div class="pair">${zoomButton(x.f,x.t+' 앞면')}${zoomButton(x.b,x.t+' 뒷면')}</div><figcaption class="cap">${x.t} · 앞면 / 뒷면</figcaption></figure>`).join('')}</div>`,
  feed:it=>`<div class="g c6">${it.imgs.map((s,i)=>zoomButton(s,`${it.title} ${i+1}`,'crop45')).join('')}</div>`,
  thumbs:it=>`<div class="g c6">${it.imgs.map((s,i)=>zoomButton(s,`${it.title} ${i+1}`,'crop11')).join('')}</div>`,
  posters:it=>`<div class="g c4">${it.imgs.map((s,i)=>zoomButton(s,`${it.title} ${i+1}`)).join('')}</div>`,
  cards:it=>`<div class="g c2 cards">${it.cards.map(c=>`<figure><div class="pair">${zoomButton(c.f,c.t+' 앞면')}${zoomButton(c.b,c.t+' 뒷면')}</div><figcaption class="cap">${c.t}</figcaption></figure>`).join('')}</div>`,
  stickers:it=>`<div class="g c2 stickers">${it.imgs.map((s,i)=>zoomButton(s,`${it.title} ${i+1}`)).join('')}</div>`,
  minis:it=>`<div class="g minis">${it.imgs.map((s,i)=>zoomButton(s,`${it.title} ${i+1}`)).join('')}</div>`,
  avideo:it=>`<div class="vid ${it.ratio==='9/16'?'vert':''}"><video controls playsinline preload="metadata" poster="${assetUrl(it.poster)}" aria-label="${escAttr(it.title)}"><source src="${assetUrl(it.src)}" type="video/mp4"></video></div>`,
  details:it=>`<div class="dgrid">${it.pages.map(([s,l])=>`<figure><div class="long" tabindex="0" aria-label="${escAttr(l)}, 위아래로 스크롤해서 보기"><div class="inner"><img src="${assetUrl(s)}" alt="${escAttr(l)}" loading="lazy" decoding="async"></div></div><figcaption class="cap">${l}</figcaption></figure>`).join('')}</div>${LONG_HINT}`,
  adetail:it=>{const g=it.gif;
    return `<div class="long" tabindex="0" aria-label="${escAttr(it.title)}, 위아래로 스크롤해서 보기"><div class="inner"><img src="${assetUrl(it.img)}" alt="${escAttr(it.title)}" loading="lazy" decoding="async">${g?`<img class="gif" src="${assetUrl(g.src)}" alt="" loading="lazy" decoding="async" style="left:${g.x/g.W*100}%;top:${g.y/g.H*100}%;width:${g.w/g.W*100}%;height:${g.h/g.H*100}%">`:''}</div></div>${LONG_HINT}`},
  agal:it=>`<div class="row">${it.imgs.map(([s,l,r])=>`<figure style="--r:${r.toFixed(3)}">${zoomButton(s,it.title+' '+l)}<figcaption class="cap">${l}</figcaption></figure>`).join('')}</div>`
};
const gallery=it=>RENDERERS[it.kind]?RENDERERS[it.kind](it):'';
/* 가운데 정렬하는 작업: 미니배너 · 상세페이지(AI) · 세로 영상 */
const isCentered=it=>it.kind==='minis'||it.kind==='adetail'||(it.kind==='avideo'&&it.ratio==='9/16');
const pad2=n=>String(n).padStart(2,'0');

function render(){
  const pageId=location.hash.slice(1)==='ai'?'ai':'work',pageCfg=PAGES[pageId],part=PARTS[pageCfg.key],otherPage=PAGES[pageCfg.other],otherPart=PARTS[otherPage.key];
  document.title=`SEOSEJI ${pageCfg.title}`;
  $('sw-work').classList.toggle('on',pageId==='work');
  $('sw-ai').classList.toggle('on',pageId==='ai');
  page.innerHTML=`
  <section class="hero">
    <div><h1 class="title">${pageCfg.title}</h1></div>
    <p class="lead">${part.lead}</p>
  </section>
  <nav class="index" aria-label="매체 목차">${part.order.map((m,i)=>`<a href="#${pageId}-${m}" data-to="${pageId}-${m}"><span>${pad2(i+1)}</span>${MEDIA[m].ko}</a>`).join('')}</nav>
  ${part.order.map((m,mi)=>`
  <section class="medium" id="${pageId}-${m}">
    <div class="m-label"><div class="m-en">${pageId==='work'?`Project ${pad2(mi+1)}`:MEDIA[m].en}</div><h2>${MEDIA[m].ko}</h2>${SHORT[m]?`<p>${SHORT[m]}</p>`:''}</div>
    <div class="works">${part.items.filter(i=>i.m===m).map(it=>`
      <article class="work ${isCentered(it)?'center':''}">
        <div class="w-head"><h3>${it.title}</h3></div>
        ${gallery(it)}
        <dl class="spec${it.time?'':' no-time'}">
          <div><dt>Tool</dt><dd>${toolIcons(it.tool)}</dd></div>
          ${it.time?`<div><dt>Time</dt><dd>${it.time}</dd></div>`:''}
          <div class="pt"><dt>Point</dt><dd>${it.point}</dd></div>
        </dl>
      </article>`).join('')}</div>
  </section>`).join('')}
  <section class="next">
    <a href="#${pageCfg.other}"><small>Next · ${otherPart.name}</small><span class="big">${otherPage.title} →</span></a>
    <a class="back" href="./">← 인트로로 돌아가기</a>
  </section>`;
  page.querySelectorAll('[data-to]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goTo(a.dataset.to)}));
  bindRingHover();
  alignLabels();
}

/* ---------- 목차 이동 ----------
   위쪽 이미지가 늦게 로드되면 높이가 바뀌어 엉뚱한 곳에 멈춤 → 위쪽 구간 이미지를 바로 불러오고,
   이미지가 로드될 때마다 JUMP_SETTLE_MS 동안 목표 위치로 다시 맞춤(사용자가 직접 스크롤하면 중단) */
let jumpTarget=null,jumpUntil=0;
function goTo(id){
  const target=$(id);if(!target)return;
  document.querySelectorAll('.medium').forEach(m=>{
    if(m!==target&&(m.compareDocumentPosition(target)&Node.DOCUMENT_POSITION_FOLLOWING))
      m.querySelectorAll('img[loading="lazy"]').forEach(img=>img.loading='eager');
  });
  jumpTarget=target;jumpUntil=performance.now()+JUMP_SETTLE_MS;
  target.scrollIntoView({behavior:'instant',block:'start'});
}
document.addEventListener('load',e=>{
  if(jumpTarget&&e.target.tagName==='IMG'&&performance.now()<jumpUntil)jumpTarget.scrollIntoView({behavior:'instant',block:'start'});
},true);
['wheel','touchstart','keydown','mousedown'].forEach(type=>addEventListener(type,e=>{if(!e.target.closest||!e.target.closest('.index'))jumpTarget=null},{passive:true}));

/* ---------- 왼쪽 매체 이름 정렬 ----------
   두 칸 배치일 때 왼쪽 이름의 글자 윗선을 오른쪽 첫 작업 제목의 글자 윗선에 맞춤.
   붙어 있는(sticky) 상태에서 재면 값이 틀어지므로 잠깐 풀고 잰다 */
const glyphTop=el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el),fs=parseFloat(cs.fontSize),lh=parseFloat(cs.lineHeight)||fs*1.2;return r.top+(lh-fs)/2+fs*GLYPH_TOP_RATIO};
function alignLabels(){
  document.querySelectorAll('.medium').forEach(section=>{
    const label=section.querySelector('.m-label'),name=label.querySelector('h2'),firstTitle=section.querySelector('.w-head h3');
    label.style.marginTop='0px';label.style.position='static';
    if(firstTitle&&label.offsetWidth<section.clientWidth*TWO_COLUMN_LIMIT){
      label.style.marginTop=(-(glyphTop(name)-glyphTop(firstTitle)))+'px';
    }
    label.style.position='';
  });
}

/* ---------- 상단 바 · 목차 상태 ---------- */
/* 상단 바 아래 선(스크롤 시) · 목차가 붙으면 어두운 배경(.stuck) */
function updateStuck(){
  topbar.classList.toggle('scrolled',scrollY>8);
  const index=page.querySelector('.index');
  if(index)index.classList.toggle('stuck',index.getBoundingClientRect().top<=topbar.offsetHeight+1);
}
/* 상단 바 · 목차 높이 → CSS 변수(목차가 상단 바 바로 밑에 붙고, 앵커 위치가 가려지지 않게) */
function updateHeights(){
  const style=document.documentElement.style,index=page.querySelector('.index');
  style.setProperty('--tbH',topbar.offsetHeight+'px');
  if(index)style.setProperty('--ixH',index.offsetHeight+'px');
}
/* 지금 보고 있는 매체를 목차에 표시(.on) */
let sectionObserver=null;
function watchSections(){
  sectionObserver&&sectionObserver.disconnect();updateHeights();
  const links=[...page.querySelectorAll('.index a')];
  sectionObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.to===e.target.id))})},{rootMargin:'-45% 0px -50% 0px'});
  page.querySelectorAll('.medium').forEach(s=>sectionObserver.observe(s));
}

/* ---------- 클릭 처리(한 곳에서): 크게 보기 열기/닫기 → 상세페이지 이미지 → 로고 툴팁 ---------- */
let lightboxOpener=null;
const closeLightbox=()=>{lightbox.hidden=true;lightboxImg.removeAttribute('src');lightboxOpener&&lightboxOpener.focus()};
document.addEventListener('click',e=>{
  const zoom=e.target.closest('[data-full]');
  if(zoom){
    lightboxOpener=zoom;lightboxImg.src=zoom.dataset.full;lightboxImg.alt=zoom.getAttribute('aria-label')||'';lightbox.hidden=false;lightboxClose.focus();
  }else if(!lightbox.hidden&&e.target.closest('#lb')){
    closeLightbox();
  }
  /* 상세페이지 상자 속 긴 이미지: 누르면 크게 */
  const longImg=e.target.closest('.long .inner>img:not(.gif)');
  if(longImg){lightboxOpener=longImg.closest('.long');lightboxImg.src=longImg.src;lightbox.hidden=false}
  /* 휴대폰: 로고를 누르면 이름이 뜨고, 다른 곳을 누르면 사라짐 */
  const tic=e.target.closest('.tic');
  document.querySelectorAll('.tic.show').forEach(x=>{if(x!==tic)x.classList.remove('show')});
  if(tic)tic.classList.toggle('show');
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!lightbox.hidden)closeLightbox()});

/* ---------- 커서: 점은 바로, 링은 부드럽게 따라옴. 링크 · 버튼 · 영상 · 상세 상자 위에서 링 확대 ---------- */
let pointerX=-100,pointerY=-100,ringX=-100,ringY=-100;
addEventListener('pointermove',e=>{pointerX=e.clientX;pointerY=e.clientY;cursorDot.style.transform=`translate(${pointerX}px,${pointerY}px)`});
(function followRing(){ringX+=(pointerX-ringX)*.2;ringY+=(pointerY-ringY)*.2;cursorRing.style.transform=`translate(${ringX}px,${ringY}px)`;requestAnimationFrame(followRing)})();
function bindRingHover(){
  document.querySelectorAll('a,button,video,.long').forEach(el=>{
    if(el.dataset.rb)return;el.dataset.rb=1;
    el.addEventListener('pointerenter',()=>cursorRing.classList.add('big'));
    el.addEventListener('pointerleave',()=>cursorRing.classList.remove('big'));
  });
}

/* ---------- 이벤트 연결 · 처음 실행 ---------- */
/* 주소 해시 변경: #work ↔ #ai 전환이면 다시 그리고 맨 위로, 그다음 높이 · 목차 상태 갱신 */
addEventListener('hashchange',()=>{
  const hash=location.hash.slice(1);
  if(hash==='work'||hash==='ai'){render();scrollTo(0,0)}
  setTimeout(()=>{updateStuck();watchSections()},0);
});
/* 스크롤 · 창 크기 변경은 한 프레임에 한 번만 처리 */
let scrollQueued=false,resizeQueued=false;
addEventListener('scroll',()=>{if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{scrollQueued=false;updateStuck()})},{passive:true});
addEventListener('resize',()=>{if(resizeQueued)return;resizeQueued=true;requestAnimationFrame(()=>{resizeQueued=false;alignLabels();updateHeights()})});
document.fonts&&document.fonts.ready.then(alignLabels);

render();
updateHeights();
watchSections();
})();
</script>
</body>
</html>
