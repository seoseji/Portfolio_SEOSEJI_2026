<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<title>SEOSEJI Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 검은 방, 줄무늬 수납장 위 은회색 80년대 CRT TV.
   인트로 = 파란 픽셀 타이포(디더링 눈) → 주황 터미널 UI가 선으로 그려지며 부팅 → 화면 안에서 CH01/CH02 선택 → 화면 속으로 줌인 */
:root{
  --bg:#070707; --surface:#141416; --raise:#1B1B1E; --line:#28282C;
  --fg:#EDEBE7; --mute:#8D8B87; --dim:#57565A;
  --sand:#D8C2A0; --ice:#9FD3E2;
  --amb:#FF6A1A;          /* 터미널 주황 형광 */
  --amb-dim:rgba(255,106,26,.38);
  --pix:#5568FF;          /* 인트로 픽셀 블루 */
  --f-disp:"Instrument Serif","Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-term:"VT323","IBM Plex Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);min-height:100%}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.draft{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--raise);border:1px solid var(--line);color:var(--mute);padding:6px 10px;border-radius:99px}

/* ---------- 방 ---------- */
#home{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 55% 50% at 50% 38%,rgba(255,255,255,.05),transparent 70%),var(--bg)}
.room-top{display:flex;justify-content:space-between;gap:12px;padding-block:20px;color:var(--dim);position:relative;z-index:2;transition:opacity .5s}
.scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:8px;transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .9s}

/* ---------- TV (은회색 80년대) ---------- */
.tv{width:min(1060px,calc(100% - 32px),calc((100vh - 100px)*1.28));position:relative;z-index:2;
  background:linear-gradient(180deg,#6B6E72 0%,#4D5054 6%,#3E4044 60%,#33353899 100%),#3A3C40;
  border-radius:10px 10px 6px 6px;padding:3.2% 3.2% 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.6),0 30px 60px rgba(0,0,0,.8)}
.bezel{background:linear-gradient(#1C1D1F,#121314);padding:2.4%;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 6px 14px rgba(0,0,0,.8)}
.screen{position:relative;aspect-ratio:4/3;border-radius:18px/22px;overflow:hidden;background:#020203;isolation:isolate;container-type:inline-size}
.strip{display:grid;grid-template-columns:1fr auto;gap:3%;align-items:center;padding:2.2% 1% 2.6%}
.btns{display:flex;gap:2px}
.btns i{flex:1;height:10px;background:linear-gradient(#5A5D61,#2E3033);border-radius:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.slots{display:grid;gap:3px;margin-top:6px}
.slots i{height:2px;background:#202124}
.right{display:flex;align-items:center;gap:10px}
.pins{width:120px;height:12px;background:repeating-linear-gradient(90deg,#B08A3A 0 2px,#3A2E14 2px 5px);border-radius:1px;opacity:.85}
.led{width:6px;height:6px;border-radius:50%;background:#3A1A0A;transition:.4s}
.tv.on .led{background:#FF5A2A;box-shadow:0 0 8px #FF5A2A}
.tv.on.term-on .led{background:#7CFF9A;box-shadow:0 0 8px #7CFF9A,0 0 16px rgba(124,255,154,.5)}   /* 인트로가 끝나고 터미널이 뜨면 초록 */
.brand{font-family:var(--f-mono);font-size:9px;letter-spacing:.3em;color:#9EA2A6}
/* 줄무늬 수납장 */
.cabinet{width:min(1320px,100%);height:clamp(70px,14vh,140px);margin-top:0;position:relative;z-index:1;
  background:repeating-linear-gradient(90deg,#8A8C8F 0 6px,#A9ABAE 6px 9px,#77797C 9px 12px);
  box-shadow:inset 0 10px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25)}
.cabinet::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#3E4043}
.cabinet::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg))}

/* ---------- 화면 레이어 ---------- */
.layer{position:absolute;inset:0}
#pix{width:100%;height:100%;image-rendering:pixelated}
#pixwrap{opacity:0}#pixwrap.on{opacity:1}
/* 작은 문구는 선명한 픽셀 글꼴로 따로 올림 (어떤 화면 크기에서도 또렷하게) */
.pixtag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:6.5%;display:flex;align-items:center;gap:.7em;font-family:"Silkscreen",monospace;font-size:clamp(13px,3.3cqw,25px);letter-spacing:.14em;line-height:1;color:#7585FF;
  text-shadow:0 0 .4em rgba(85,104,255,.85);opacity:0;transition:opacity .15s steps(2)}
.pixtag i{width:.55em;height:.55em;background:currentColor;box-shadow:0 0 .4em rgba(85,104,255,.85)}
#pixwrap.on .pixtag{opacity:1;transition-delay:.5s}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
.vig{box-shadow:inset 0 0 70px 16px rgba(0,0,0,.9);border-radius:inherit}
.glare{background:radial-gradient(ellipse 70% 45% at 28% 8%,rgba(255,255,255,.08),transparent 60%)}
#noise{position:absolute;inset:0;width:100%;height:100%;z-index:4;opacity:0;mix-blend-mode:screen;pointer-events:none;image-rendering:pixelated}
.crt{position:absolute;inset:0;opacity:0}
.tv.on .crt{animation:crton .55s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes crton{0%{opacity:1;transform:scale(0,.006);filter:brightness(12)}40%{opacity:1;transform:scale(1,.006);filter:brightness(8)}100%{opacity:1;transform:none;filter:none}}
/* 채널 선택 후: 브라운관이 가로선 → 점으로 꺼짐 */
.tv.off .crt{animation:crtoff .5s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes crtoff{0%{opacity:1;transform:none;filter:none}55%{opacity:1;transform:scale(1,.006);filter:brightness(7)}85%{opacity:1;transform:scale(.02,.006);filter:brightness(12)}100%{opacity:0;transform:scale(0,0)}}
.flick{animation:flick .25s steps(3) 1}
@keyframes flick{0%{transform:translateX(-4px) skewX(6deg);filter:hue-rotate(40deg) brightness(1.6)}50%{transform:translateX(5px)}100%{transform:none;filter:none}}

/* ---------- 주황 터미널 UI ---------- */
.term{position:absolute;inset:0;padding:4.2cqw 4.6cqw;display:grid;gap:1.6cqw;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"menu menu" "ch1 ch2" "foot foot";
  --amb:var(--pix);  /* 기본: 오프닝과 같은 파란 형광 */
  color:var(--amb);font-family:var(--f-term);font-size:clamp(11px,2.3cqw,19px);line-height:1.15;letter-spacing:.04em;
  text-shadow:0 0 .5cqw color-mix(in srgb,var(--amb) 85%,transparent),0 0 1.6cqw color-mix(in srgb,var(--amb) 40%,transparent);opacity:0}
.term.show{opacity:1}
.p{position:relative;padding:1.6cqw 1.8cqw;min-width:0;min-height:0}
/* 패널 테두리: 위 → 오른쪽 → 아래 → 왼쪽 순서로 선이 그려짐 */
.p>.box{position:absolute;inset:0;pointer-events:none;border-radius:3px;transition:background-color .25s,box-shadow .25s;
  --g:linear-gradient(var(--amb),var(--amb));
  background-image:var(--g),var(--g),var(--g),var(--g);background-repeat:no-repeat;
  background-position:top left,top right,bottom right,bottom left;
  background-size:0 var(--bw,1.5px),var(--bw,1.5px) 0,0 var(--bw,1.5px),var(--bw,1.5px) 0;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--amb) 80%,transparent))}
.p.go>.box{animation:draw .6s linear forwards}
@keyframes draw{
  0%{background-size:0 var(--bw,1.5px),var(--bw,1.5px) 0,0 var(--bw,1.5px),var(--bw,1.5px) 0}
  25%{background-size:100% var(--bw,1.5px),var(--bw,1.5px) 0,0 var(--bw,1.5px),var(--bw,1.5px) 0}
  50%{background-size:100% var(--bw,1.5px),var(--bw,1.5px) 100%,0 var(--bw,1.5px),var(--bw,1.5px) 0}
  75%{background-size:100% var(--bw,1.5px),var(--bw,1.5px) 100%,100% var(--bw,1.5px),var(--bw,1.5px) 0}
  100%{background-size:100% var(--bw,1.5px),var(--bw,1.5px) 100%,100% var(--bw,1.5px),var(--bw,1.5px) 100%}}
.menu{grid-area:menu;display:flex;justify-content:space-between;gap:1cqw;padding:.7cqw 2cqw;font-size:clamp(10px,1.9cqw,16px);text-transform:uppercase}
.diag{grid-area:diag;display:flex;flex-direction:column;gap:1cqw}
.bars{display:grid;gap:.45cqw}
.bars i{height:.8cqw;background:var(--amb);box-shadow:0 0 .6cqw rgba(255,106,26,.7);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.diag.go .bars i{width:var(--w)}
.ty{white-space:pre}
.small{font-size:clamp(9px,1.7cqw,14px);opacity:.85}
.gauge{flex:1 1 0;min-height:0;height:0;width:100%;margin-top:auto}
.gauge circle{fill:none;stroke:var(--amb);stroke-width:1}
.gauge .arc{stroke-width:6;stroke-dasharray:0 1;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1) .5s;transform:rotate(-90deg);transform-origin:50% 50%;opacity:.9}
.diag.go .gauge .arc{stroke-dasharray:.72 1}
.ch{display:flex;flex-direction:column;gap:.8cqw;cursor:pointer;color:var(--amb);font-family:inherit;font-size:inherit;
  text-shadow:0 0 .5cqw color-mix(in srgb,var(--amb) 85%,transparent),0 0 1.6cqw color-mix(in srgb,var(--amb) 40%,transparent)}
/* 마우스를 올리거나 선택하면 채널 색으로 */
.ch.c1:hover,.ch.c1:focus-visible,.ch.c1.on{--amb:#FF7A2E}
.ch.c2:hover,.ch.c2:focus-visible,.ch.c2.on{--amb:#5FD6F0}
.ch.c1{grid-area:ch1}.ch.c2{grid-area:ch2}
.ch .hd{display:flex;justify-content:space-between;gap:1cqw;text-transform:uppercase}
.ch .wire{width:100%;flex:1 1 0;height:0;min-height:0;overflow:visible}
.wire .w{fill:none;stroke:var(--amb);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease-in-out calc(var(--d,0)*1s)}
.wire .ld{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s calc(.9s + var(--d,0)*1s)}
.wire text{fill:var(--amb);font-family:var(--f-term);font-size:9px;opacity:0;transition:opacity .15s calc(1.1s + var(--d,0)*1s);stroke:none}
.ch.go .w,.ch.go .ld{stroke-dashoffset:0}
.ch.go .wire text{opacity:1}
.ch .ko{font-family:var(--f-body);font-weight:600;font-size:clamp(14px,3.2cqw,28px);letter-spacing:-.01em;line-height:1.1}
.ch .st>span:not(.enter-btn){line-height:1;margin-bottom:.15em}
.ch .st{display:flex;justify-content:space-between;align-items:flex-end;gap:1cqw;text-transform:uppercase;white-space:nowrap}
.ch .sel{display:none}
@media(min-width:701px){.ch .ko{text-align:center;font-size:clamp(18px,4.4cqw,38px)}.ch .st{justify-content:center;margin-top:.9cqw;margin-bottom:4.6cqw}.ch .enter-btn{font-size:clamp(12px,2.5cqw,20px)}}
/* 항상 보이는 입장 버튼(마우스가 없는 휴대폰에서도 눌러야 할 곳이 보이게) */
.enter-btn{font-family:var(--f-body);font-weight:600;letter-spacing:0;text-transform:none;font-size:clamp(11px,2.1cqw,17px);padding:.6cqw 1.8cqw;border:1px solid var(--amb);border-radius:99px;
  color:var(--amb);animation:ctaPulse 1.7s ease-in-out infinite}
@keyframes ctaPulse{50%{background:color-mix(in srgb,var(--amb) 20%,transparent);box-shadow:0 0 1.4cqw color-mix(in srgb,var(--amb) 55%,transparent)}}
.ch:hover .enter-btn,.ch:focus-visible .enter-btn,.ch.on .enter-btn{background:var(--amb);color:#050506;text-shadow:none;animation:none}
.mi-grp{display:flex;gap:2.4cqw}
.mi{font:inherit;color:inherit;text-shadow:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:.2cqw .8cqw;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.mi[data-go=archive]:hover,.mi[data-go=archive]:focus-visible{color:#FF7A2E;border-color:#FF7A2E;outline:none}
.mi[data-go=ailab]:hover,.mi[data-go=ailab]:focus-visible{color:#5FD6F0;border-color:#5FD6F0;outline:none}
.ch:hover>.box,.ch:focus-visible>.box,.ch.on>.box{background-color:color-mix(in srgb,var(--amb) 11%,transparent)}
.ch>.box{--bw:clamp(2.5px,.45cqw,4.5px);transition:none}
.ch:hover .sel,.ch:focus-visible .sel,.ch.on .sel{display:inline;animation:blink .8s steps(2) infinite}
.ch:hover .ok,.ch:focus-visible .ok,.ch.on .ok{display:none}
.ch:focus-visible{outline:none}
@keyframes blink{50%{opacity:0}}
.foot{grid-area:foot;padding:.8cqw 2cqw;display:flex;justify-content:space-between;gap:2cqw;text-transform:uppercase}
.cur::after{content:"█";animation:blink 1s steps(2) infinite;margin-left:.3em}
.osd{position:absolute;right:6%;top:6%;z-index:6;font-family:var(--f-term);font-size:clamp(28px,8cqw,64px);color:#7CFF9A;text-shadow:0 0 10px #7CFF9A;opacity:0;pointer-events:none}
.osd.show{opacity:1}

/* 줌인 */
#home.zoom .scene{opacity:0;transition:opacity .45s ease}
#home.zoom .room-top{opacity:0}
.skip{position:absolute;z-index:8;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--dim);padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(7,7,7,.7);transition:opacity .4s}
#home.ready .skip{opacity:0;pointer-events:none}

/* ---------- 파트 페이지 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.part{--acc:#FF7A2E;animation:fadeIn .6s both} #ailab{--acc:#5FD6F0}
@keyframes fadeIn{from{opacity:0}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(7,7,7,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.bar .name{text-decoration:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:99px}
.seg a{text-decoration:none;padding:5px 12px;border-radius:99px;color:var(--mute)}
.seg a.on{background:var(--fg);color:var(--bg)}
.p-head{padding-block:72px 32px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.p-head .k{color:var(--acc);display:flex;gap:8px;align-items:center}
.p-head .k i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.p-head h2{font-family:var(--f-body);font-weight:600;font-size:clamp(40px,6.6vw,88px);line-height:1.05;margin:14px 0 0;letter-spacing:-.02em;color:var(--acc);
  text-shadow:0 0 10px color-mix(in srgb,var(--acc) 65%,transparent),0 0 36px color-mix(in srgb,var(--acc) 28%,transparent)}
/* 파트 제목: 인트로처럼 도트가 깨졌다가 선명해지는 효과(캔버스가 글자 위에 겹쳐 그려짐) */
.p-head h2{position:relative;width:fit-content}
.p-head h2 canvas.gl{position:absolute;left:0;top:0;display:none;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--acc) 70%,transparent))}
.p-head h2.gl{color:transparent;text-shadow:none}
.p-head h2.gl canvas.gl{display:block}
.p-head p{margin:0 0 0 auto;color:var(--mute);text-align:right}
.toc-row{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-bottom:40px}
@media(min-width:1001px){.toc-row{min-height:1lh}.toc-row .lead{position:absolute;right:0;top:0}}   /* 안내 문구는 두 파트 모두 같은 높이에서 시작(두 줄이면 아래로 이어짐) */
.toc-row .lead{margin:0;color:var(--mute);text-align:right;transform:translateY(-3px)}
.toc{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--mute)}
.toc button:hover{color:var(--fg)}
.medium{padding-block:56px;border-top:1px solid var(--line);scroll-margin-top:calc(var(--barH,56px) + env(safe-area-inset-top,0px))}
/* 스크롤하면 소제목이 상단 바 아래에 붙어 따라오고, 다음 구간이 시작되면 밀려나며 바뀜 */
.m-head{position:sticky;top:calc(var(--barH,56px) + env(safe-area-inset-top,0px));z-index:6;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 20px;
  padding-block:12px;margin-bottom:24px;background:rgba(7,7,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.m-head .m-no{margin-left:auto;color:var(--acc);align-self:flex-end;align-self:last baseline;line-height:1.6;white-space:nowrap}
.m-desc-m{display:none;margin:0 0 24px;color:var(--mute)}
.m-head .k{color:var(--acc)}
.m-head h3{font-size:30px;font-weight:500;margin:6px 0 0;letter-spacing:-.01em}
.m-head p{margin:0 0 5px;color:var(--mute);max-width:32em}
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.works.one{grid-template-columns:minmax(0,1fr)}
.work .stage2{background:none;border-radius:0;padding:clamp(20px,4vw,48px);display:grid;place-items:center;min-height:380px}
.work h4{font-size:17px;font-weight:500;margin:18px 0 12px}
.spec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.spec dt{color:var(--dim);padding-top:2px}
.spec dd{margin:0}
.ex{color:var(--dim);font-family:var(--f-mono);font-size:10px;margin-left:6px}
/* 파트 페이지 글씨 키움(큰 타이틀·하단 화살표 제외) */
.part .mono{font-size:13px}
.part .bar .mono,.part .bar .name{font-size:11px}
.m-head h3{font-size:34px}
.m-head p,.toc-row .lead,.m-desc-m{font-size:17px}
.work h4{font-size:20px}
.work .sub{font-size:15px}
.spec{font-size:16px}
.ex{font-size:12px}
.fl .chip2{font-size:12px}
.toc{font-size:13px}
.toc button,.toc.mono{letter-spacing:.02em;text-transform:none}
.next{padding-block:64px 96px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.next a{text-decoration:none;font-family:var(--f-body);font-weight:600;font-size:clamp(22px,3.4vw,40px);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:.35em}
.next .ar{font-size:.62em;line-height:1}
.next a:hover{color:var(--acc)}
.t{display:grid;place-items:center;color:rgba(237,235,231,.3);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;width:100%;
  background:linear-gradient(155deg,hsl(var(--h) 16% 27%),hsl(var(--h) 20% 13%))}
.mk{width:100%;max-width:100%}
.street{aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(#1E2430,#2B2F38 60%,#151619 60%)}
.street .bd{position:absolute;bottom:40%;background:#13161C}
.street .bd.a{left:0;width:28%;height:52%}.street .bd.b{right:0;width:24%;height:64%}
.street .bb{position:absolute;left:28%;top:12%;width:50%;aspect-ratio:2/1;border:5px solid #08090B;box-shadow:0 0 60px rgba(216,194,160,.15)}
.street .bb .t{height:100%}
.street .pole{position:absolute;left:52%;top:37%;width:2.5%;height:23%;background:#08090B}
.browser{border-radius:10px;overflow:hidden;background:#F1F0EC;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.browser .top{display:flex;gap:6px;padding:10px 12px;background:#DEDCD6}
.browser .top i{width:9px;height:9px;border-radius:50%;background:#BDBAB3}
.browser .body{padding:16px;display:grid;gap:10px}
.browser .ln{height:9px;border-radius:2px;background:#E2E0DA}
.desk{aspect-ratio:4/3;border-radius:10px;background:radial-gradient(circle at 40% 40%,#38322A,#1B1915);display:grid;place-items:center;position:relative;overflow:hidden}
.paper{width:46%;aspect-ratio:210/297;transform:rotate(-5deg);background:#F1F0EC;padding:7px;box-shadow:0 24px 40px rgba(0,0,0,.55)}
.paper .t{height:100%}
.paper.back{position:absolute;width:38%;right:6%;bottom:-8%;transform:rotate(10deg);padding:0}
.phone{width:min(230px,100%);margin:0 auto;border:7px solid #050506;border-radius:32px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px #333,0 30px 60px rgba(0,0,0,.55)}
.phone .notch{height:22px;display:flex;justify-content:center;align-items:center}
.phone .notch i{width:68px;height:6px;border-radius:9px;background:#111}
.igh{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;font-weight:600;color:#111}
.igh i{width:22px;height:22px;border-radius:50%;background:#C9C4BA}
.igf{padding:8px 10px 14px;display:grid;gap:5px}
.igf span{height:7px;border-radius:2px;background:#E8E6E1}
.scroll{height:400px;overflow:hidden}
.scroll .t{height:1000px;animation:pan 10s ease-in-out infinite alternate}
@keyframes pan{to{transform:translateY(-600px)}}
.serp{background:#F1F0EC;border-radius:10px;padding:16px;display:grid;gap:14px;color:#111;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.serp .q{border:1.5px solid #111;border-radius:99px;padding:7px 14px;font-size:13px}
.res{display:grid;grid-template-columns:minmax(0,1fr) 32%;gap:12px;align-items:center}
.res .tx{display:grid;gap:6px}.res .tx b{font-size:13px;font-weight:600}
.res .tx span{height:7px;border-radius:2px;background:#E2E0DA}
.res .t{aspect-ratio:1;border-radius:6px}
.res.dim{opacity:.4}.res.dim .t{background:#D8D6D0}
.player{border-radius:10px;overflow:hidden;background:#000;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.player .v{position:relative}
.player .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:17px}
.player .ctl{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--mute)}
.player .tr{flex:1;height:2px;background:#333;position:relative}
.player .tr::before{content:"";position:absolute;inset:0 58% 0 0;background:var(--acc)}
.frame{background:#F1F0EC;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.5)}

/* ---------- 옥외배너 실물 목업 (매장 앞 거리) ---------- */
.work.wide .stage2{padding:0;min-height:0;overflow:hidden;display:block}
.ob{position:relative;width:100%;aspect-ratio:16/9;display:flex;justify-content:center;align-items:flex-end;gap:4%;padding:0 6% 6.5%;
  background:radial-gradient(ellipse 55% 45% at 50% 28%,rgba(255,214,160,.10),transparent 70%),
    linear-gradient(#1C2026 0,#2A2E35 64%,#4A4C50 64%,#4A4C50 64.5%,#2B2C2F 64.5%,#1C1D20 100%)}
.ob::before{content:"";position:absolute;left:0;right:0;bottom:0;height:35.5%;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.035) 9% 9.25%)}
.ob::after{content:"";position:absolute;left:8%;right:8%;top:8%;height:46%;border:1px solid rgba(255,255,255,.04);background:linear-gradient(rgba(255,255,255,.025),transparent);pointer-events:none}
.ob .unit{position:relative;z-index:1;flex:0 0 auto;cursor:zoom-in;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ob .unit:hover,.ob .unit:focus-visible{transform:translateY(-6px)}
.ob .unit::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-3%;height:6%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);z-index:-1}
/* 물통 X배너 */
.xb{width:14.5%;display:flex;flex-direction:column;align-items:center}
.xb .rod{width:108%;height:clamp(3px,.45vw,6px);border-radius:3px;background:linear-gradient(#6a6d72,#1a1b1e)}
.xb img{width:100%;display:block;box-shadow:0 14px 28px rgba(0,0,0,.55)}
.xb .pole{width:6%;height:clamp(8px,1.6vw,20px);background:linear-gradient(90deg,#6d7076,#c9ccd1,#6d7076)}
.xb .tank{width:80%;height:clamp(10px,2.2vw,26px);border-radius:45% 45% 6px 6px/70% 70% 6px 6px;background:linear-gradient(#4a4d53,#1b1c1f);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
/* 양면 윈드배너 */
.wb{width:14%;margin-bottom:3%}
.wb .flag{display:block;width:100%;aspect-ratio:385/1154;object-fit:cover;clip-path:url(#flagClip);transform-origin:100% 50%;animation:flap 3.4s ease-in-out infinite alternate}
.wb:nth-child(4) .flag{clip-path:url(#flagClipB)}
.wb:nth-child(2) .flag{animation-delay:-.9s}.wb:nth-child(3) .flag{animation-delay:-1.7s}.wb:nth-child(4) .flag{animation-delay:-2.4s}
@keyframes flap{from{transform:perspective(700px) rotateY(0) skewY(0)}to{transform:perspective(700px) rotateY(-16deg) skewY(-1.2deg)}}
.wb .pole{position:absolute;right:-2%;top:-1.5%;width:4%;min-width:2px;height:111%;border-radius:2px;background:linear-gradient(90deg,#85888d,#e4e6e9,#85888d)}
.wb .base{position:absolute;right:-24%;bottom:-11%;width:50%;height:clamp(7px,1.4vw,16px);border-radius:50% 50% 4px 4px/80% 80% 4px 4px;background:linear-gradient(#4a4d53,#1b1c1f)}
.wb::after{bottom:-12%!important}
.work .sub{margin:-8px 0 12px;color:var(--mute);font-size:13px}
.ob-hint{position:absolute;right:12px;bottom:10px;z-index:2;color:var(--dim)}

/* ---------- 스탠드 배너: 실물 거치대 + 가로 슬라이드 ---------- */
.work.wide .stage2{padding:clamp(32px,4vw,56px) 0 clamp(24px,3vw,40px)}
.marq{--H:420px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-top:12px;outline:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{display:flex;width:max-content}
.marq::-webkit-scrollbar{display:none}
/* 슬라이드 버튼 */
.carousel{position:relative;width:100%;min-width:0}
.work{min-width:0}
.marq{width:100%;max-width:100%}
.cbtn{position:absolute;top:50%;z-index:3;width:46px;height:46px;margin-top:-23px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(12,12,14,.82);backdrop-filter:blur(6px);color:var(--acc);font-size:12px;line-height:1;
  transition:border-color .2s,box-shadow .2s,background .2s}
.cbtn:hover,.cbtn:focus-visible{border-color:var(--acc);background:rgba(12,12,14,.95);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 45%,transparent);outline:none}
.cbtn.c-prev{left:16px}.cbtn.c-next{right:16px}
.sw svg path{stroke-linejoin:round}
/* ---------- 현수막: 아일렛(쇠고리) + 끈으로 건 모습 ---------- */
.hangwall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 64px;padding:16px clamp(36px,6vw,80px) 4px}
.hb{margin:0;min-width:0;display:flex;flex-direction:column;gap:14px}
.hb.long{grid-column:1/-1;padding:0 3%}
.hangwall.mix{grid-template-columns:minmax(0,.8fr) minmax(0,1fr);align-items:center}
/* ---------- AI 개인 프로젝트: 영상 · 상세페이지 · 이미지 ---------- */
.avid{width:100%;display:grid;place-items:center;padding:0}
.avid.vert{padding:clamp(8px,2vw,24px)}
.avid-in{width:100%;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #2a2f3a,0 30px 70px rgba(0,0,0,.55)}
.avid.vert .avid-in{width:min(430px,100%);border:8px solid #050506;border-radius:36px;box-shadow:0 0 0 1px #333,0 30px 70px rgba(0,0,0,.55)}
.avid video{display:block;width:100%;height:auto;background:#000}
.aphone{width:min(430px,100%);margin:0 auto;border:8px solid #050506;border-radius:36px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px #333,0 30px 60px rgba(0,0,0,.55)}
.anotch{height:22px;display:flex;justify-content:center;align-items:center;background:#fff}
.anotch i{width:68px;height:6px;border-radius:9px;background:#111}
.ascroll{height:min(780px,86vh);overflow-y:auto;overflow-x:hidden;background:#fff;overscroll-behavior:contain;scrollbar-width:thin}
.ascroll img{display:block;width:100%;height:auto}
.ascroll iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.agal{--H:clamp(140px,18vw,250px);width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,2vw,24px);align-items:flex-end;padding:clamp(20px,3.4vw,44px)}
.agal figure{margin:0;min-width:0;max-width:100%;flex:none;display:flex;flex-direction:column;gap:10px}
.ag{display:block;cursor:zoom-in;border-radius:10px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.ag img{display:block;width:100%;height:auto;transition:transform .35s}
.ag:hover img,.ag:focus-visible img{transform:scale(1.03)}
.agal.row{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;--H:clamp(110px,13vw,190px);scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
.agal.row figure:first-child{margin-left:auto}.agal.row figure:last-child{margin-right:auto}
.agal figcaption{color:var(--dim)}
/* ---------- 맨 위로 가기 버튼 ---------- */
#totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;font-size:18px;line-height:1;color:var(--tt,var(--sand));background:rgba(12,12,14,.86);border:1px solid var(--line);backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .3s,border-color .2s,box-shadow .2s}
#totop.on{opacity:1;transform:none;pointer-events:auto}
#totop:hover,#totop:focus-visible{border-color:var(--tt,var(--sand));box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--tt,var(--sand)) 45%,transparent)}
/* ---------- 포스터: 벽에 붙인 종이 ---------- */
.posters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,3vw,40px);padding:clamp(24px,4vw,52px)}
.pst{position:relative;display:block;aspect-ratio:900/1270;transform:none;cursor:zoom-in;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pst:hover,.pst:focus-visible{transform:scale(1.03)}
.pst img{display:block;width:100%;height:100%;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px rgba(0,0,0,.45)}
.pst::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.16),transparent 30%,transparent 70%,rgba(0,0,0,.12))}
.pst::before{content:"";position:absolute;z-index:1;top:-8px;left:50%;width:34%;height:16px;transform:translateX(-50%) rotate(-2deg);background:rgba(235,228,210,.75);box-shadow:0 1px 2px rgba(0,0,0,.2)}
/* ---------- 블로그 썸네일: 검색창 + 썸네일 목록 ---------- */
.bl-wrap{width:100%;padding:clamp(20px,4vw,48px)}
.blbox{max-width:900px;margin:0 auto;background:#f3f2ee;border-radius:14px;padding:clamp(16px,2.4vw,26px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.bl-q{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;margin-bottom:clamp(14px,2vw,22px);border:2px solid #03c75a;border-radius:99px;background:#fff;color:#222;font-size:14px}
.bl-q i{font-style:normal;color:#03c75a;font-size:18px;line-height:1}
.bl-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,1.2vw,14px)}
.bl-cell{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:zoom-in;background:#ddd;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bl-cell img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.bl-cell:hover img,.bl-cell:focus-visible img{transform:scale(1.05)}
/* ---------- 인스타그램 프로필 피드 목업 ---------- */
.ig-wrap{width:100%;padding:clamp(20px,4vw,48px)}
.ig{max-width:860px;margin:0 auto;background:#fff;color:#111;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.ig-top{display:flex;align-items:center;gap:18px;padding:22px 24px 16px}
.ig-av{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;
  box-shadow:0 0 0 3px #fff,0 0 0 5px #e1306c}
.ig-id{display:flex;flex-direction:column;gap:4px;min-width:0}
.ig-id b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-id span{font-size:13px;color:#555}.ig-id em{font-style:normal;font-weight:600;color:#111}
.ig-tabs{display:flex;justify-content:center;gap:48px;border-top:1px solid #e6e6e6;font-size:11px;letter-spacing:.08em;color:#8e8e8e}
.ig-tabs span{padding:10px 0}.ig-tabs .on{color:#111;border-top:1px solid #111;margin-top:-1px}
.ig-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.ig-cell{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;cursor:zoom-in;background:#eee}
.ig-cell img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s,filter .25s}
.ig-cell:hover img,.ig-cell:focus-visible img{transform:scale(1.04);filter:brightness(.9)}
.ig-reel{position:absolute;top:6px;right:7px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* ---------- 홈페이지 목업: 브라우저 + 사이트 헤더 + 풀와이드 롤링배너 / 팝업 ---------- */
.work.wide .stage2{justify-items:stretch;place-items:stretch}
.site-wrap{width:100%;padding:clamp(20px,4vw,48px)}
.site{position:relative;width:100%;background:#f3f4f6;border-radius:12px;overflow:hidden;color:#222;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.site-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#e2e4e8}
.site-bar i{width:9px;height:9px;border-radius:50%;background:#c2c5cb}
.site-bar .url{flex:1;max-width:46%;height:16px;margin-left:14px;border-radius:99px;background:#fff}
.site-head{display:flex;align-items:center;gap:clamp(12px,3vw,32px);padding:12px 4%;background:#fff;border-bottom:1px solid #eceef1;font-size:12px;color:#333}
.site-head .logo{width:56px;height:16px;border-radius:4px;background:#1f2a44;flex:none}
.site-head nav{display:flex;gap:clamp(10px,2vw,24px);flex:1;white-space:nowrap}
.site-head .cta{padding:5px 12px;border-radius:99px;background:#1f2a44;color:#fff;font-size:11px;white-space:nowrap}
.hero{position:relative;aspect-ratio:1920/900;background:#111;overflow:hidden}
.hero .sl{position:absolute;inset:0;display:block;width:100%;opacity:0;transition:opacity .8s ease;cursor:zoom-in}
.hero .sl.on{opacity:1;z-index:1}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.hero-still{position:absolute;inset:0}
.h-arrow{position:absolute;top:50%;z-index:3;width:clamp(30px,3.6vw,48px);height:clamp(30px,3.6vw,48px);transform:translateY(-50%);left:3%;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-size:clamp(18px,2vw,28px);line-height:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(4px);transition:background .2s}
.h-arrow.nx{left:auto;right:3%}
.h-arrow:hover,.h-arrow:focus-visible{background:rgba(255,255,255,.32)}
.h-dots{position:absolute;left:0;right:0;bottom:5%;z-index:3;display:flex;justify-content:center;gap:8px}
.h-dots button{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.45);transition:width .3s,background .3s}
.h-dots button.on{width:26px;background:#fff}
.site-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6%;padding:2% 4% 2.4%}
.site-body b{grid-column:1/-1;width:18%;height:9px;margin-bottom:4px;border-radius:4px;background:#d5d8dd}
.site-body i{aspect-ratio:3/1;border-radius:6px;background:#e4e6ea}
/* 팝업배너: 목업 없이 정사각 이미지 그대로 */
.pop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);padding:clamp(20px,4vw,48px)}
.pg{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:zoom-in;box-shadow:0 14px 30px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pg:hover,.pg:focus-visible{transform:scale(1.02)}
.pg img{display:block;width:100%;height:100%;object-fit:cover}
.pop-dim{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.55)}
.pop{position:absolute;z-index:5;left:50%;top:54%;transform:translate(-50%,-50%);width:min(38%,440px);background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.pop-stage{position:relative;aspect-ratio:1}
.pop-stage .sl{position:absolute;inset:0;display:block;width:100%;opacity:0;transition:opacity .6s ease;cursor:zoom-in}
.pop-stage .sl.on{opacity:1;z-index:1}
.pop-stage img{display:block;width:100%;height:100%;object-fit:cover}
.pop-foot{display:flex;justify-content:space-between;padding:8px 12px;font-size:11px;color:#ddd;background:#1d1e21}
.pop-thumbs{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}
.pop-thumbs button{width:58px;aspect-ratio:1;border-radius:6px;overflow:hidden;opacity:.45;outline:2px solid transparent;outline-offset:2px;transition:opacity .2s,outline-color .2s}
.pop-thumbs button.on,.pop-thumbs button:hover{opacity:1}
.pop-thumbs button.on{outline-color:var(--acc)}
.pop-thumbs img{display:block;width:100%;height:100%;object-fit:cover}
/* ---------- 전단지: 종이 질감 + 누르면 앞뒷면 뒤집기 ---------- */
.flyers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:52px 40px;padding:12px clamp(24px,4vw,56px) 4px;align-items:end}
.fl{margin:0;min-width:0;display:flex;flex-direction:column;gap:16px;grid-column:span 2}
.fl.wide{grid-column:span 3}
.flip-btn{position:relative;display:block;width:100%;aspect-ratio:var(--r);perspective:1800px;cursor:pointer}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transform:rotate(0deg);transition:transform .85s cubic-bezier(.3,.7,.2,1)}
.fl.on .flip{transform:rotate(0deg) rotateY(180deg)}
.face{position:absolute;inset:0;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;

document.querySelectorAll('.carousel').forEach(c=>{
  const m=c.querySelector('.marq'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pos=0,hold=0,over=false,anim=0,last=performance.now();
  const track=m.querySelector('.track'),first=track.querySelector('.set');
  const half=()=>first.getBoundingClientRect().width;   /* 배너 묶음 하나의 폭 */
  /* 묶음이 화면보다 짧으면 넘길 공간이 없어서, 화면 폭을 채울 때까지 복제해 이어 붙임 */

      k.querySelectorAll('button').forEach(b=>{b.tabIndex=-1;b.setAttribute('aria-hidden','true')});track.appendChild(k);n++}};
  const unit=()=>{const u=m.querySelector('.su'),g=parseFloat(getComputedStyle(m.querySelector('.set')).columnGap)||60;return u.getBoundingClientRect().width+g};
  const wrap=()=>{const h=half();if(m.scrollLeft>=h){m.scrollLeft-=h}else if(m.scrollLeft<=0){m.scrollLeft+=h}pos=m.scrollLeft};
  m.addEventListener('scroll',()=>{if(!anim&&Math.abs(m.scrollLeft-pos)>2){hold=performance.now()+2500;wrap()}},{passive:true});
  ['pointerenter','focusin','touchstart'].forEach(t=>m.addEventListener(t,()=>over=true,{passive:true}));
  ['pointerleave','focusout','touchend'].forEach(t=>m.addEventListener(t,()=>{over=false;hold=performance.now()+1200},{passive:true}));
  (function tick(now){
    const dt=Math.min(64,now-last);last=now;
    if(m.offsetParent)fill();

    requestAnimationFrame(tick);
  })(last);
  /* 직접 움직이는 애니메이션: 브라우저 smooth 스크롤은 되감기(wrap)에 끊겨서 왼쪽 버튼이 멈췄음 */
  const go=d=>{if(anim)return;anim=1;wrap();if(d<0&&m.scrollLeft<unit()){m.scrollLeft+=half()}
    const from=m.scrollLeft,to=from+d*unit(),t0=performance.now(),dur=still?1:450;hold=t0+3500+dur;
    const step=n=>{const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);m.scrollLeft=from+(to-from)*e;pos=m.scrollLeft;
      if(k<1)requestAnimationFrame(step);else{anim=0;wrap();hold=performance.now()+3500}};

  m.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='ArrowRight'){e.preventDefault();go(1)}});
});

const pix=document.getElementById('pix'),pctx=pix.getContext('2d'),pixwrap=document.getElementById('pixwrap');

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

}

function renderPix(t){
  drawSource(t);

  const reveal=reduce?PH:Math.min(1,t/.55)*PH;                   /* 위에서 아래로 스캔되며 나타남 */
  const glitchRow=!reduce&&Math.random()<.35?(Math.random()*PH|0):-1;
  const out=pctx.createImageData(PW,PH),o=out.data;
  for(let y=0;y<PH;y++){

    for(let x=0;x<PW;x++){

  term.querySelectorAll('.ty').forEach(el=>el.textContent='');
}

/* ---------- 전체 시퀀스 ---------- */
async function powerOn(fast){
  const id=++runId;resetTerminal();pixwrap.classList.remove('on');
  tv.classList.remove('on','off');void tv.offsetWidth;tv.classList.add('on');
  if(fast){noiseLevel=.04;return bootTerminal(id,true)}
  /* '움직임 줄이기' 설정이 켜져 있어도 오프닝은 항상 보여줌 (노이즈·흔들림만 빼고) */
  noiseLevel=reduce?0:.5;await wait(450);noiseLevel=reduce?0:.08;           /* CRT 켜짐 */
  await playPixel(id);if(id!==runId)return;                  /* 파란 픽셀 인트로 */
  if(!reduce)crt.classList.add('flick');noiseLevel=reduce?0:.6;await wait(220);  /* 신호 전환 */
  crt.classList.remove('flick');pixwrap.classList.remove('on');noiseLevel=reduce?0:.05;
  await bootTerminal(id,false);                              /* 주황 터미널 */
}
document.getElementById('skip').onclick=()=>powerOn(true);

/* ---------- 채널 선택 ---------- */
const chs=[...document.querySelectorAll('.ch')];
chs.forEach((c,i)=>{
  c.addEventListener('mouseenter',()=>{stopAttract();chs.forEach(x=>x.classList.toggle('on',x===c))});
  c.addEventListener('click',()=>{stopAttract();choose(c.dataset.go)});
});
document.querySelectorAll('.mi').forEach(b=>b.addEventListener('click',()=>{stopAttract();choose(b.dataset.go)}));
/* 마우스를 박스 위에 올려 둔 동안만 멈추고, 벗어나면 다시 번갈아 켜짐 (PC는 마우스가 늘 움직이므로 움직임만으로는 멈추지 않음) */
chs.forEach(c=>c.addEventListener('mouseleave',()=>setTimeout(()=>{if(ready&&!busy&&!att&&!chs.some(x=>x.matches(':hover')))startAttract()},900)));
addEventListener('keydown',e=>{
  if(home.hidden||busy)return;
  if(ready&&(e.key==='1'||e.key==='2')){stopAttract();choose(chs[+e.key-1].dataset.go);return}
  if(ready&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))stopAttract();
  if(!ready&&(e.key==='Enter'||e.key===' '||e.key==='Escape')){powerOn(true);return}
  if(ready&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const c=chs[e.key==='ArrowLeft'?0:1];c.focus();chs.forEach(x=>x.classList.toggle('on',x===c))}
});
async function choose(key){
  if(busy||!ready)return;busy=true;
  osd.textContent=PARTS[key].ch;osd.classList.add('show');
  crt.classList.add('flick');noiseLevel=.55;await wait(380);
  crt.classList.remove('flick');noiseLevel=0;
  tv.classList.add('off');await wait(560);          /* 브라운관 꺼짐 */
  osd.classList.remove('show');
  home.classList.add('zoom');await wait(450);        /* 방이 어두워짐 */
  location.hash=key;
}

/* ---------- 파트 제목 도트 글리치 ---------- */
/* 인트로와 같은 방식: 글자를 큰 도트로 뭉갠 뒤(디더링) 도트가 잘게 쪼개지며 선명해짐. 열리자마자 길게, 이후 주기적으로 짧게 반복 */
let glRun=0;
function glitchTitle(h2,dur){
  if(reduce||!h2||!h2.offsetParent)return Promise.resolve();
  const cs=getComputedStyle(h2),r=h2.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  const color=cs.color==='rgba(0, 0, 0, 0)'?(h2.dataset.col||'#fff'):cs.color;h2.dataset.col=color;
  const W=Math.ceil(r.width),H=Math.ceil(r.height),txt=h2.dataset.t||(h2.dataset.t=h2.textContent.trim());
  let cv=h2.querySelector('canvas.gl');
  if(!cv){cv=document.createElement('canvas');cv.className='gl';cv.setAttribute('aria-hidden','true');h2.appendChild(cv)}
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  /* 글자 원본(실제 제목과 같은 글꼴·위치) */
  const src=document.createElement('canvas');src.width=cv.width;src.height=cv.height;const s=src.getContext('2d');
  s.scale(dpr,dpr);s.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;if('letterSpacing' in s)s.letterSpacing=cs.letterSpacing;
  const m=s.measureText(txt),asc=m.fontBoundingBoxAscent||parseFloat(cs.fontSize)*.9,desc=m.fontBoundingBoxDescent||parseFloat(cs.fontSize)*.25;
  s.fillStyle='#fff';s.textBaseline='alphabetic';s.fillText(txt,0,(H-(asc+desc))/2+asc);
  const x=cv.getContext('2d'),sm=document.createElement('canvas'),smc=sm.getContext('2d',{willReadFrequently:true});
  h2.classList.add('gl');
  const t0=performance.now();
  return new Promise(res=>{
    const draw=n=>{
      const k=Math.min(1,(n-t0)/dur),lv=1-k;
      x.clearRect(0,0,cv.width,cv.height);
      if(k>=1){h2.classList.remove('gl');return res()}
      if(Math.random()<.18*lv){requestAnimationFrame(draw);return}      /* 신호가 잠깐 끊김 */
      const b=Math.max(2,Math.round((3+lv*lv*15)*dpr));                   /* 도트 크기: 크게 → 작게 */
      const sw=Math.ceil(cv.width/b),sh=Math.ceil(cv.height/b);sm.width=sw;sm.height=sh;
      smc.clearRect(0,0,sw,sh);smc.drawImage(src,0,0,sw,sh);
      const d=smc.getImageData(0,0,sw,sh).data;
      x.fillStyle=color;
      for(let j=0;j<sh;j++){
        const sh2=Math.random()<.3*lv?Math.round((Math.random()*2-1)*(2+lv*4)):0;  /* 줄 단위로 밀림 */
        for(let i=0;i<sw;i++){
          const a=d[(j*sw+i)*4+3]/255,th=(BAYER[(j&3)*4+(i&3)]+.5)/16;
          if(a>th*.85+.05*lv)x.fillRect((i+sh2)*b,j*b,b,b);
        }
      }
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  });
}
function startTitleGlitch(key){
  const id=++glRun,h2=document.querySelector('#'+key+' .p-head h2');
  (async()=>{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    if(id!==glRun)return;
    await glitchTitle(h2,1100);
    while(id===glRun){
      await wait(3600+Math.random()*1400);
      if(id!==glRun)break;
      await glitchTitle(h2,520);
    }
  })();
}

/* ---------- 라우팅 ---------- */
let first=true;
function route(){
  const k=location.hash.slice(1),on=k in PARTS;
  home.hidden=on;
  for(const n in PARTS)document.getElementById(n).hidden=(n!==k);
  scrollTo(0,0);
  if(on)startTitleGlitch(k);else glRun++;
  if(!on){
    home.classList.remove('zoom');osd.classList.remove('show');busy=false;
    powerOn(!first);
  }
  first=false;
}
addEventListener('hashchange',route);route();
</script>
