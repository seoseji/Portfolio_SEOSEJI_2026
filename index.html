<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SEOSEJI Portfolio · TV 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 검은 방, 줄무늬 수납장 위 은회색 80년대 CRT TV.
   인트로 = 파란 픽셀 타이포(디더링 눈) → 주황 터미널 UI가 선으로 그려지며 부팅 → 화면 안에서 CH01/CH02 선택 → 화면 속으로 줌인 */
:root{
  --bg:#070707; --surface:#141416; --raise:#1B1B1E; --line:#28282C;
  --fg:#EDEBE7; --mute:#8D8B87; --dim:#57565A;
  --sand:#D8C2A0; --ice:#9FD3E2;
  --amb:#FF6A1A;          /* 터미널 주황 형광 */
  --amb-dim:rgba(255,106,26,.38);
  --pix:#3D4DFF;          /* 인트로 픽셀 블루 */
  --f-disp:"Instrument Serif","Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-term:"VT323","IBM Plex Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);min-height:100%}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.draft{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--raise);border:1px solid var(--line);color:var(--mute);padding:6px 10px;border-radius:99px}

/* ---------- 방 ---------- */
#home{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 55% 50% at 50% 38%,rgba(255,255,255,.05),transparent 70%),var(--bg)}
.room-top{display:flex;justify-content:space-between;gap:12px;padding-block:20px;color:var(--dim);position:relative;z-index:2;transition:opacity .5s}
.scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:8px;transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .9s}

/* ---------- TV (은회색 80년대) ---------- */
.tv{width:min(1060px,calc(100% - 32px),calc((100vh - 100px)*1.28));position:relative;z-index:2;
  background:linear-gradient(180deg,#6B6E72 0%,#4D5054 6%,#3E4044 60%,#33353899 100%),#3A3C40;
  border-radius:10px 10px 6px 6px;padding:3.2% 3.2% 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.6),0 30px 60px rgba(0,0,0,.8)}
.bezel{background:linear-gradient(#1C1D1F,#121314);padding:2.4%;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 6px 14px rgba(0,0,0,.8)}
.screen{position:relative;aspect-ratio:4/3;border-radius:18px/22px;overflow:hidden;background:#020203;isolation:isolate;container-type:inline-size}
.strip{display:grid;grid-template-columns:1fr auto;gap:3%;align-items:center;padding:2.2% 1% 2.6%}
.btns{display:flex;gap:2px}
.btns i{flex:1;height:10px;background:linear-gradient(#5A5D61,#2E3033);border-radius:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.slots{display:grid;gap:3px;margin-top:6px}
.slots i{height:2px;background:#202124}
.right{display:flex;align-items:center;gap:10px}
.pins{width:120px;height:12px;background:repeating-linear-gradient(90deg,#B08A3A 0 2px,#3A2E14 2px 5px);border-radius:1px;opacity:.85}
.led{width:6px;height:6px;border-radius:50%;background:#3A1A0A;transition:.4s}
.tv.on .led{background:#FF5A2A;box-shadow:0 0 8px #FF5A2A}
.brand{font-family:var(--f-mono);font-size:9px;letter-spacing:.3em;color:#9EA2A6}
/* 줄무늬 수납장 */
.cabinet{width:min(1320px,100%);height:clamp(70px,14vh,140px);margin-top:0;position:relative;z-index:1;
  background:repeating-linear-gradient(90deg,#8A8C8F 0 6px,#A9ABAE 6px 9px,#77797C 9px 12px);
  box-shadow:inset 0 10px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25)}
.cabinet::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#3E4043}
.cabinet::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg))}

/* ---------- 화면 레이어 ---------- */
.layer{position:absolute;inset:0}
#pix{width:100%;height:100%;image-rendering:pixelated}
#pixwrap{opacity:0}#pixwrap.on{opacity:1}
/* 작은 문구는 선명한 픽셀 글꼴로 따로 올림 (어떤 화면 크기에서도 또렷하게) */
.pixtag{position:absolute;left:5.5%;bottom:6.5%;display:flex;align-items:center;gap:.7em;font-family:"Silkscreen",monospace;font-size:clamp(11px,2.7cqw,20px);letter-spacing:.14em;line-height:1;color:#5B6BFF;
  text-shadow:0 0 .4em rgba(61,77,255,.85);opacity:0;transition:opacity .15s steps(2)}
.pixtag i{width:.55em;height:.55em;background:currentColor;box-shadow:0 0 .4em rgba(61,77,255,.85)}
#pixwrap.on .pixtag{opacity:1;transition-delay:.5s}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
.vig{box-shadow:inset 0 0 70px 16px rgba(0,0,0,.9);border-radius:inherit}
.glare{background:radial-gradient(ellipse 70% 45% at 28% 8%,rgba(255,255,255,.08),transparent 60%)}
#noise{position:absolute;inset:0;width:100%;height:100%;z-index:4;opacity:0;mix-blend-mode:screen;pointer-events:none;image-rendering:pixelated}
.crt{position:absolute;inset:0;opacity:0}
.tv.on .crt{animation:crton .55s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes crton{0%{opacity:1;transform:scale(0,.006);filter:brightness(12)}40%{opacity:1;transform:scale(1,.006);filter:brightness(8)}100%{opacity:1;transform:none;filter:none}}
/* 채널 선택 후: 브라운관이 가로선 → 점으로 꺼짐 */
.tv.off .crt{animation:crtoff .5s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes crtoff{0%{opacity:1;transform:none;filter:none}55%{opacity:1;transform:scale(1,.006);filter:brightness(7)}85%{opacity:1;transform:scale(.02,.006);filter:brightness(12)}100%{opacity:0;transform:scale(0,0)}}
.flick{animation:flick .25s steps(3) 1}
@keyframes flick{0%{transform:translateX(-4px) skewX(6deg);filter:hue-rotate(40deg) brightness(1.6)}50%{transform:translateX(5px)}100%{transform:none;filter:none}}

/* ---------- 주황 터미널 UI ---------- */
.term{position:absolute;inset:0;padding:4.2cqw 4.6cqw;display:grid;gap:1.6cqw;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"menu menu" "ch1 ch2" "foot foot";
  --amb:var(--pix);  /* 기본: 오프닝과 같은 파란 형광 */
  color:var(--amb);font-family:var(--f-term);font-size:clamp(11px,2.3cqw,19px);line-height:1.15;letter-spacing:.04em;
  text-shadow:0 0 .5cqw color-mix(in srgb,var(--amb) 85%,transparent),0 0 1.6cqw color-mix(in srgb,var(--amb) 40%,transparent);opacity:0}
.term.show{opacity:1}
.p{position:relative;padding:1.6cqw 1.8cqw;min-width:0;min-height:0}
/* 패널 테두리: 위 → 오른쪽 → 아래 → 왼쪽 순서로 선이 그려짐 */
.p>.box{position:absolute;inset:0;pointer-events:none;border-radius:3px;transition:background-color .25s,box-shadow .25s;
  --g:linear-gradient(var(--amb),var(--amb));
  background-image:var(--g),var(--g),var(--g),var(--g);background-repeat:no-repeat;
  background-position:top left,top right,bottom right,bottom left;
  background-size:0 1.5px,1.5px 0,0 1.5px,1.5px 0;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--amb) 80%,transparent))}
.p.go>.box{animation:draw .6s linear forwards}
@keyframes draw{
  0%{background-size:0 1.5px,1.5px 0,0 1.5px,1.5px 0}
  25%{background-size:100% 1.5px,1.5px 0,0 1.5px,1.5px 0}
  50%{background-size:100% 1.5px,1.5px 100%,0 1.5px,1.5px 0}
  75%{background-size:100% 1.5px,1.5px 100%,100% 1.5px,1.5px 0}
  100%{background-size:100% 1.5px,1.5px 100%,100% 1.5px,1.5px 100%}}
.menu{grid-area:menu;display:flex;justify-content:space-between;gap:1cqw;padding:.7cqw 2cqw;font-size:clamp(10px,1.9cqw,16px);text-transform:uppercase}
.diag{grid-area:diag;display:flex;flex-direction:column;gap:1cqw}
.bars{display:grid;gap:.45cqw}
.bars i{height:.8cqw;background:var(--amb);box-shadow:0 0 .6cqw rgba(255,106,26,.7);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.diag.go .bars i{width:var(--w)}
.ty{white-space:pre}
.small{font-size:clamp(9px,1.7cqw,14px);opacity:.85}
.gauge{flex:1 1 0;min-height:0;height:0;width:100%;margin-top:auto}
.gauge circle{fill:none;stroke:var(--amb);stroke-width:1}
.gauge .arc{stroke-width:6;stroke-dasharray:0 1;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1) .5s;transform:rotate(-90deg);transform-origin:50% 50%;opacity:.9}
.diag.go .gauge .arc{stroke-dasharray:.72 1}
.ch{display:flex;flex-direction:column;gap:.8cqw;cursor:pointer;color:var(--amb);font-family:inherit;font-size:inherit;transition:color .25s;
  text-shadow:0 0 .5cqw color-mix(in srgb,var(--amb) 85%,transparent),0 0 1.6cqw color-mix(in srgb,var(--amb) 40%,transparent)}
/* 마우스를 올리거나 선택하면 채널 색으로 */
.ch.c1:hover,.ch.c1:focus-visible,.ch.c1.on{--amb:#FF7A2E}
.ch.c2:hover,.ch.c2:focus-visible,.ch.c2.on{--amb:#5FD6F0}
.ch.c1{grid-area:ch1}.ch.c2{grid-area:ch2}
.ch .hd{display:flex;justify-content:space-between;gap:1cqw;text-transform:uppercase}
.ch .wire{width:100%;flex:1 1 0;height:0;min-height:0;overflow:visible}
.wire .w{fill:none;stroke:var(--amb);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease-in-out calc(var(--d,0)*1s)}
.wire .ld{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s calc(.9s + var(--d,0)*1s)}
.wire text{fill:var(--amb);font-family:var(--f-term);font-size:9px;opacity:0;transition:opacity .15s calc(1.1s + var(--d,0)*1s);stroke:none}
.ch.go .w,.ch.go .ld{stroke-dashoffset:0}
.ch.go .wire text{opacity:1}
.ch .ko{font-family:var(--f-body);font-weight:600;font-size:clamp(14px,3.2cqw,28px);letter-spacing:-.01em;line-height:1.1}
.ch .st{display:flex;justify-content:space-between;gap:1cqw;text-transform:uppercase;white-space:nowrap}
.ch .sel{display:none}
.ch:hover>.box,.ch:focus-visible>.box,.ch.on>.box{background-color:color-mix(in srgb,var(--amb) 11%,transparent);box-shadow:inset 0 0 0 1px var(--amb)}
.ch:hover .sel,.ch:focus-visible .sel,.ch.on .sel{display:inline;animation:blink .8s steps(2) infinite}
.ch:hover .ok,.ch:focus-visible .ok,.ch.on .ok{display:none}
.ch:focus-visible{outline:none}
@keyframes blink{50%{opacity:0}}
.foot{grid-area:foot;padding:.8cqw 2cqw;display:flex;justify-content:space-between;gap:2cqw;text-transform:uppercase}
.cur::after{content:"█";animation:blink 1s steps(2) infinite;margin-left:.3em}
.osd{position:absolute;right:6%;top:6%;z-index:6;font-family:var(--f-term);font-size:clamp(28px,8cqw,64px);color:#7CFF9A;text-shadow:0 0 10px #7CFF9A;opacity:0;pointer-events:none}
.osd.show{opacity:1}

/* 줌인 */
#home.zoom .scene{opacity:0;transition:opacity .45s ease}
#home.zoom .room-top{opacity:0}
.skip{position:absolute;z-index:8;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--dim);padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(7,7,7,.7);transition:opacity .4s}
#home.ready .skip{opacity:0;pointer-events:none}

/* ---------- 파트 페이지 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.part{--acc:#FF7A2E;animation:fadeIn .6s both} #ailab{--acc:#5FD6F0}
@keyframes fadeIn{from{opacity:0}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(7,7,7,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.bar .name{text-decoration:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:99px}
.seg a{text-decoration:none;padding:5px 12px;border-radius:99px;color:var(--mute)}
.seg a.on{background:var(--fg);color:var(--bg)}
.p-head{padding-block:72px 40px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.p-head .k{color:var(--acc);display:flex;gap:8px;align-items:center}
.p-head .k i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.p-head h2{font-family:var(--f-body);font-weight:600;font-size:clamp(40px,6.6vw,88px);line-height:1.05;margin:14px 0 0;letter-spacing:-.02em;color:var(--acc);
  text-shadow:0 0 10px color-mix(in srgb,var(--acc) 65%,transparent),0 0 36px color-mix(in srgb,var(--acc) 28%,transparent)}
.p-head p{margin:0 0 0 auto;color:var(--mute);text-align:right}
.toc{display:flex;gap:6px 18px;flex-wrap:wrap;padding-bottom:40px;color:var(--mute)}
.toc button:hover{color:var(--fg)}
.medium{padding-block:56px;border-top:1px solid var(--line);scroll-margin-top:70px}
.m-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 20px;margin-bottom:32px}
.m-head .k{color:var(--acc)}
.m-head h3{font-size:30px;font-weight:500;margin:6px 0 0;letter-spacing:-.01em}
.m-head p{margin:0 0 5px;color:var(--mute);max-width:32em}
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.works.one{grid-template-columns:minmax(0,1fr)}
.work .stage2{background:var(--raise);border-radius:14px;padding:clamp(20px,4vw,48px);display:grid;place-items:center;min-height:380px}
.work h4{font-size:17px;font-weight:500;margin:18px 0 12px}
.spec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.spec dt{color:var(--dim);padding-top:2px}
.spec dd{margin:0}
.ex{color:var(--dim);font-family:var(--f-mono);font-size:10px;margin-left:6px}
.next{padding-block:64px 96px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.next a{text-decoration:none;font-family:var(--f-body);font-weight:600;font-size:clamp(22px,3.4vw,40px);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:.35em}
.next .ar{font-size:.62em;line-height:1}
.next a:hover{color:var(--acc)}
.t{display:grid;place-items:center;color:rgba(237,235,231,.3);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;width:100%;
  background:linear-gradient(155deg,hsl(var(--h) 16% 27%),hsl(var(--h) 20% 13%))}
.mk{width:100%;max-width:100%}
.street{aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(#1E2430,#2B2F38 60%,#151619 60%)}
.street .bd{position:absolute;bottom:40%;background:#13161C}
.street .bd.a{left:0;width:28%;height:52%}.street .bd.b{right:0;width:24%;height:64%}
.street .bb{position:absolute;left:28%;top:12%;width:50%;aspect-ratio:2/1;border:5px solid #08090B;box-shadow:0 0 60px rgba(216,194,160,.15)}
.street .bb .t{height:100%}
.street .pole{position:absolute;left:52%;top:37%;width:2.5%;height:23%;background:#08090B}
.browser{border-radius:10px;overflow:hidden;background:#F1F0EC;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.browser .top{display:flex;gap:6px;padding:10px 12px;background:#DEDCD6}
.browser .top i{width:9px;height:9px;border-radius:50%;background:#BDBAB3}
.browser .body{padding:16px;display:grid;gap:10px}
.browser .ln{height:9px;border-radius:2px;background:#E2E0DA}
.desk{aspect-ratio:4/3;border-radius:10px;background:radial-gradient(circle at 40% 40%,#38322A,#1B1915);display:grid;place-items:center;position:relative;overflow:hidden}
.paper{width:46%;aspect-ratio:210/297;transform:rotate(-5deg);background:#F1F0EC;padding:7px;box-shadow:0 24px 40px rgba(0,0,0,.55)}
.paper .t{height:100%}
.paper.back{position:absolute;width:38%;right:6%;bottom:-8%;transform:rotate(10deg);padding:0}
.phone{width:min(230px,100%);margin:0 auto;border:7px solid #050506;border-radius:32px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px #333,0 30px 60px rgba(0,0,0,.55)}
.phone .notch{height:22px;display:flex;justify-content:center;align-items:center}
.phone .notch i{width:68px;height:6px;border-radius:9px;background:#111}
.igh{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;font-weight:600;color:#111}
.igh i{width:22px;height:22px;border-radius:50%;background:#C9C4BA}
.igf{padding:8px 10px 14px;display:grid;gap:5px}
.igf span{height:7px;border-radius:2px;background:#E8E6E1}
.scroll{height:400px;overflow:hidden}
.scroll .t{height:1000px;animation:pan 10s ease-in-out infinite alternate}
@keyframes pan{to{transform:translateY(-600px)}}
.serp{background:#F1F0EC;border-radius:10px;padding:16px;display:grid;gap:14px;color:#111;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.serp .q{border:1.5px solid #111;border-radius:99px;padding:7px 14px;font-size:13px}
.res{display:grid;grid-template-columns:minmax(0,1fr) 32%;gap:12px;align-items:center}
.res .tx{display:grid;gap:6px}.res .tx b{font-size:13px;font-weight:600}
.res .tx span{height:7px;border-radius:2px;background:#E2E0DA}
.res .t{aspect-ratio:1;border-radius:6px}
.res.dim{opacity:.4}.res.dim .t{background:#D8D6D0}
.player{border-radius:10px;overflow:hidden;background:#000;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.player .v{position:relative}
.player .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:17px}
.player .ctl{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--mute)}
.player .tr{flex:1;height:2px;background:#333;position:relative}
.player .tr::before{content:"";position:absolute;inset:0 58% 0 0;background:var(--acc)}
.frame{background:#F1F0EC;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.5)}

/* ---------- 옥외배너 실물 목업 (매장 앞 거리) ---------- */
.work.wide .stage2{padding:0;min-height:0;overflow:hidden;display:block}
.ob{position:relative;width:100%;aspect-ratio:16/9;display:flex;justify-content:center;align-items:flex-end;gap:4%;padding:0 6% 6.5%;
  background:radial-gradient(ellipse 55% 45% at 50% 28%,rgba(255,214,160,.10),transparent 70%),
    linear-gradient(#1C2026 0,#2A2E35 64%,#4A4C50 64%,#4A4C50 64.5%,#2B2C2F 64.5%,#1C1D20 100%)}

      {m:'image',title:'올인원 스킨로션 컷',h:185,r:'1/1',tool:'Higgsfield, Photoshop',time:'3시간',point:'컷마다 달라지는 AI 이미지의 톤 보정'}
    ]}
};
const tile=(h,r,label='작업물',extra='')=>`<div class="t" style="--h:${h};aspect-ratio:${r};${extra}">${label}</div>`;
function mock(it){
  switch(it.m){
    case 'outdoor':
      if(it.kind==='stand'){
        const X=(s,c)=>`<button class="su sx" data-full="${s}" ${c?'tabindex="-1" aria-hidden="true"':'aria-label="물통 X배너 크게 보기"'}><span class="bar"></span><img src="${s}" alt="" loading="lazy"><span class="bar"></span><span class="pole"></span><svg class="tank" viewBox="0 0 140 40" aria-hidden="true"><path d="M10,40 Q2,40 3.5,32 L12,11 Q15,5 23,5 L117,5 Q125,5 128,11 L136.5,32 Q138,40 130,40 Z" fill="url(#tankG)"/><path d="M15,10 L125,10" stroke="rgba(255,255,255,.2)" stroke-width="1.2"/><path d="M8,33 L132,33" stroke="rgba(255,255,255,.06)" stroke-width="1"/><ellipse cx="70" cy="6.5" rx="6" ry="1.8" fill="#000"/><ellipse cx="106" cy="7.5" rx="8" ry="2.2" fill="#26282c" stroke="#55585d" stroke-width=".7"/></svg><span class="shadow"></span></button>`;
        const W=(s,b,c)=>{const px=99,d='M99,322 L99,3 Q99,.8 91,.8 L58.5,6 L43.5,12 L33.5,18 L26.5,24 L20.5,30 L16.5,36 L12.5,42 L9.5,48 L7,54 L4.8,60 L3.3,66 L1.8,72 L.8,80';
          return `<button class="su sw ${b?'b':''}" data-full="${s}" ${c?'tabindex="-1" aria-hidden="true"':'aria-label="양면 윈드배너 크게 보기"'}><span class="fw"><img class="flag" src="${s}" alt="" loading="lazy"><svg viewBox="0 0 100 340" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#4d5055" stroke-width="3.6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#eef0f2" stroke-width="1.4" stroke-linecap="round"/><path d="M${px-21},322 L${px-21},336 Q${px-21},341 ${px},341 Q${px+21},341 ${px+21},336 L${px+21},322 Z" fill="url(#drumG)"/><ellipse cx="${px}" cy="322" rx="21" ry="4.5" fill="#2c2e32" stroke="#4a4d52" stroke-width=".6"/><ellipse cx="${px}" cy="321.6" rx="3" ry="1" fill="#000"/><ellipse cx="${px+11}" cy="322" rx="4" ry="1.2" fill="#1a1b1e" stroke="#5a5d62" stroke-width=".5"/></svg></span><span class="shadow"></span></button>`};
        const set=c=>`<div class="set" ${c?'aria-hidden="true"':''}>${it.units.map(([k,s])=>k==='x'?X(s,c):W(s,k==='wb',c)).join('')}</div>`;
        return `<div class="carousel"><button class="cbtn c-prev" aria-label="이전 배너">◀</button><div class="marq" tabindex="0" aria-label="스탠드 배너 목록, 좌우로 넘겨 볼 수 있어요"><div class="track">${set(false)}${set(true)}</div></div><button class="cbtn c-next" aria-label="다음 배너">▶</button></div>`;
      }
      if(it.kind==='xbanner')return `<div class="ob">${it.imgs.map((s,i)=>`<button class="unit xb" data-full="${s}" aria-label="${it.title} ${i+1} 크게 보기"><i class="rod"></i><img src="${s}" alt="${it.title} ${i+1}" loading="lazy"><i class="rod"></i><i class="pole"></i><i class="tank"></i></button>`).join('')}<span class="ob-hint mono">클릭하면 크게 보기</span></div>`;
      if(it.kind==='wind')return `<div class="ob">${it.imgs.map((s,i)=>`<button class="unit wb" data-full="${s}" aria-label="${it.title} ${i+1} 크게 보기"><img class="flag" src="${s}" alt="${it.title} ${i+1}" loading="lazy"><i class="pole"></i><i class="base"></i></button>`).join('')}<span class="ob-hint mono">클릭하면 크게 보기</span></div>`;
      return `<div class="mk street"><div class="bd a"></div><div class="bd b"></div><div class="pole"></div><div class="bb">${tile(it.h,'auto')}</div></div>`;
    case 'banner':return `<div class="mk browser"><div class="top"><i></i><i></i><i></i></div><div class="body"><div class="ln" style="width:35%"></div>${tile(it.h,'728/220','작업물','border-radius:4px')}<div class="ln"></div><div class="ln" style="width:70%"></div></div></div>`;
    case 'flyer':return `<div class="mk desk"><div class="paper back"></div><div class="paper">${tile(it.h,'auto')}</div></div>`;
    case 'insta':return `<div class="phone"><div class="notch"><i></i></div><div class="igh"><i></i>brand_official</div>${tile(it.h,'4/5')}<div class="igf"><span style="width:45%"></span><span></span><span style="width:75%"></span></div></div>`;
    case 'blog':return `<div class="mk serp" style="max-width:520px"><div class="q">검색 키워드</div><div class="res"><div class="tx"><b>블로그 포스팅 제목</b><span></span><span style="width:70%"></span></div>${tile(it.h,'1/1')}</div><div class="res dim"><div class="tx"><b>다른 블로그 글</b><span></span><span style="width:60%"></span></div><div class="t"></div></div></div>`;
    case 'detail':return `<div class="phone"><div class="notch"><i></i></div><div class="scroll">${tile(it.h,'auto','작업물 · 자동 스크롤')}</div></div>`;
    case 'video':{const v=it.fmt==='9:16';return `<div class="mk player" style="${v?'max-width:240px':''}"><div class="v">${tile(it.h,v?'9/16':'16/9')}<span class="play">▶</span></div><div class="ctl mono">0:09<div class="tr"></div>0:15</div></div>`;}
    case 'image':return `<div class="mk frame" style="max-width:320px">${tile(it.h,it.r)}</div>`;
  }
}
function renderPart(key){
  const P=PARTS[key],el=document.getElementById(key),other=key==='archive'?'ailab':'archive';
  el.innerHTML=`
  <header class="bar"><div class="wrap"><a class="name" href="#">◀ TV로 돌아가기</a>
    <div class="seg mono"><a href="#archive" class="${key==='archive'?'on':''}">CH 01</a><a href="#ailab" class="${key==='ailab'?'on':''}">CH 02</a></div></div></header>
  <div class="wrap">
    <div class="p-head"><div><div class="k mono"><i></i>${P.k}</div><h2>${P.name}</h2></div><p>${P.lead}</p></div>
    <nav class="toc mono">${P.order.map(m=>`<button class="mono" data-to="${key}-${m}">${MEDIA[m].ko}</button>`).join('')}</nav>
    ${P.order.map(m=>{const list=P.items.filter(i=>i.m===m);return `
      <section class="medium" id="${key}-${m}">
        <div class="m-head"><div><div class="k mono">${MEDIA[m].en}</div><h3>${MEDIA[m].ko}</h3></div><p>${MEDIA[m].desc}</p></div>
        <div class="works ${list.length===1||m==='outdoor'?'one':''}">${list.map(it=>`
          <article class="work ${it.units?'wide':''}"><div class="stage2">${mock(it)}</div><h4>${it.title}</h4>${it.sub?`<p class="sub">${it.sub}</p>`:''}
            <dl class="spec"><dt class="mono">Tool</dt><dd>${it.tool}<span class="ex">예시</span></dd>
            <dt class="mono">Time</dt><dd>${it.time}<span class="ex">예시</span></dd>
            <dt class="mono">Point</dt><dd>${it.point}</dd></dl></article>`).join('')}</div>
      </section>`}).join('')}
    <div class="next"><a href="#"><span class="ar">◀</span>TV</a><a href="#${other}">${PARTS[other].ch} ${PARTS[other].name}<span class="ar">▶</span></a></div>
  </div>`;
  el.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.to).scrollIntoView({behavior:'smooth'}));
}
renderPart('archive');renderPart('ailab');
/* 작업물 크게 보기 */
const lb=document.getElementById('lb'),lbImg=lb.querySelector('img');let lbFrom=null;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-full]');
  if(b){lbFrom=b;lbImg.src=b.dataset.full;lbImg.alt=b.getAttribute('aria-label')||'';lb.hidden=false;document.getElementById('lb-close').focus();return}
  if(!lb.hidden&&(e.target===lb||e.target===lbImg||e.target.id==='lb-close')){lb.hidden=true;lbFrom&&lbFrom.focus()}
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!lb.hidden){lb.hidden=true;lbFrom&&lbFrom.focus()}});
/* 스탠드 배너 슬라이드: 천천히 자동으로 흐르고, 버튼·스와이프로도 넘김 */
document.querySelectorAll('.carousel').forEach(c=>{
  const m=c.querySelector('.marq'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pos=0,hold=0,over=false,last=performance.now();
  const half=()=>m.scrollWidth/2;
  const unit=()=>{const u=m.querySelector('.su'),g=parseFloat(getComputedStyle(m.querySelector('.set')).columnGap)||60;return u.getBoundingClientRect().width+g};
  const wrap=()=>{const h=half();if(m.scrollLeft>=h){m.scrollLeft-=h}else if(m.scrollLeft<=0){m.scrollLeft+=h}pos=m.scrollLeft};
  m.addEventListener('scroll',()=>{if(Math.abs(m.scrollLeft-pos)>2){hold=performance.now()+2500;wrap()}},{passive:true});
  ['pointerenter','focusin','touchstart'].forEach(t=>m.addEventListener(t,()=>over=true,{passive:true}));
  ['pointerleave','focusout','touchend'].forEach(t=>m.addEventListener(t,()=>{over=false;hold=performance.now()+1200},{passive:true}));
  (function tick(now){
    const dt=Math.min(64,now-last);last=now;
    if(!still&&!over&&now>hold&&m.offsetParent){pos+=dt*.032;if(pos>=half())pos-=half();m.scrollLeft=pos}
    requestAnimationFrame(tick);
  })(last);
  const go=d=>{wrap();if(d<0&&m.scrollLeft<unit()){m.scrollLeft+=half();pos=m.scrollLeft}
    hold=performance.now()+3500;m.scrollBy({left:d*unit(),behavior:still?'auto':'smooth'})};
  c.querySelector('.c-prev').onclick=()=>go(-1);c.querySelector('.c-next').onclick=()=>go(1);
  m.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='ArrowRight'){e.preventDefault();go(1)}});
});

/* ---------- 공통 ---------- */
const home=document.getElementById('home'),tv=document.getElementById('tv'),crt=document.getElementById('crt');
const term=document.getElementById('term'),osd=document.getElementById('osd');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
let runId=0,busy=false,ready=false;

/* 노이즈 */
const nz=document.getElementById('noise'),nctx=nz.getContext('2d'),nimg=nctx.createImageData(200,150);
let noiseLevel=0,lastN=0;
(function noise(now){
  if(now-lastN>50&&noiseLevel>0){lastN=now;for(let i=0;i<nimg.data.length;i+=4){const v=Math.random()*255;nimg.data[i]=nimg.data[i+1]=nimg.data[i+2]=v;nimg.data[i+3]=255}nctx.putImageData(nimg,0,0)}
  nz.style.opacity=noiseLevel;requestAnimationFrame(noise);
})(0);

/* ---------- ① 파란 픽셀 인트로 (디더링) ---------- */
const pix=document.getElementById('pix'),pctx=pix.getContext('2d'),pixwrap=document.getElementById('pixwrap');
const PW=160,PH=120;
const off=document.createElement('canvas');off.width=PW;off.height=PH;const octx=off.getContext('2d',{willReadFrequently:true});
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const BLUE=[61,77,255],NAVY=[6,8,40];
function drawSource(t){
  octx.fillStyle='#000';octx.fillRect(0,0,PW,PH);
  /* 눈: 방사형 그라데이션 → 디더링으로 도트 질감 */
  const blink=t>1.15&&t<1.4?Math.abs(Math.sin((t-1.15)/.25*Math.PI)):0;
  octx.save();octx.translate(80,62);octx.scale(1,1-blink*.92);
  const g=octx.createRadialGradient(0,0,4,0,0,46);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(.35,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
  octx.beginPath();octx.ellipse(0,0,58,26,0,0,Math.PI*2);octx.fillStyle=g;octx.fill();
  const look=Math.sin(t*2.2)*6;
  octx.beginPath();octx.arc(look,0,15,0,Math.PI*2);octx.fillStyle='rgba(0,0,0,.85)';octx.fill();
  octx.beginPath();octx.arc(look,0,15,0,Math.PI*2);octx.strokeStyle='rgba(255,255,255,.55)';octx.lineWidth=2;octx.stroke();
  octx.beginPath();octx.arc(look+5,-5,3.5,0,Math.PI*2);octx.fillStyle='#fff';octx.fill();
  octx.restore();
  /* 픽셀 타이포 */
  octx.fillStyle='#fff';octx.textBaseline='top';
  octx.font='700 8px Silkscreen, monospace';
  octx.fillText('26',8,8);octx.textAlign='right';octx.fillText('.11',152,8);octx.textAlign='left';
  octx.font='700 16px Silkscreen, monospace';
  octx.fillText('SEOSEJI',8,20);
  octx.textAlign='right';octx.fillText('PORTFOLIO',152,82);octx.textAlign='left';

}
/* 작은 문구는 디더링 없이 선명한 도트로 따로 찍음 */
let txtMask=null;
function buildTextMask(){
  const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.textBaseline='top';x.font='400 8px Silkscreen, monospace';
  if('letterSpacing' in x)x.letterSpacing='1px';
  x.fillRect(8,109,3,3);                         /* 앞쪽 포인트 도트 */
  x.fillText('WHERE THE EYE LANDS',14,107);
  const d=x.getImageData(0,0,PW,PH).data;txtMask=new Uint8Array(PW*PH);
  for(let i=0;i<PW*PH;i++)txtMask[i]=d[i*4+3]>110?1:0;
}
function renderPix(t){
  drawSource(t);
  const src=octx.getImageData(0,0,PW,PH),d=src.data;
  const reveal=reduce?PH:Math.min(1,t/.55)*PH;                   /* 위에서 아래로 스캔되며 나타남 */
  const glitchRow=!reduce&&Math.random()<.35?(Math.random()*PH|0):-1;
  const out=pctx.createImageData(PW,PH),o=out.data;
  for(let y=0;y<PH;y++){
    const shift=(glitchRow>=0&&Math.abs(y-glitchRow)<4)?(Math.random()*10-5|0):0;
    for(let x=0;x<PW;x++){
      const sx=Math.min(PW-1,Math.max(0,x+shift)),i=(y*PW+sx)*4,j=(y*PW+x)*4;
      const lum=d[i]/255,th=(BAYER[(y&3)*4+(x&3)]+.5)/16;
      const on=y<reveal&&lum>th;
      const c=on?BLUE:NAVY;
      o[j]=c[0];o[j+1]=c[1];o[j+2]=c[2];o[j+3]=255;
    }
  }
  pctx.putImageData(out,0,0);
}
async function playPixel(id){
  try{await Promise.race([document.fonts.load('700 16px Silkscreen'),new Promise(r=>setTimeout(r,1200))])}catch(e){}
  pixwrap.classList.add('on');const t0=performance.now();
  await new Promise(res=>{
    (function loop(now){
      if(id!==runId)return res();
      const t=(now-t0)/1000;renderPix(t);
      if(t<2.1)requestAnimationFrame(loop);else res();
    })(t0);
  });
}

/* ---------- ② 주황 터미널 부팅 ---------- */
function typeIn(el,fast){
  const full=el.dataset.t;if(fast){el.textContent=full;return Promise.resolve()}
  el.textContent='';let i=0;
  return new Promise(r=>{const iv=setInterval(()=>{i+=2;el.textContent=full.slice(0,i);if(i>=full.length){clearInterval(iv);r()}},18)});
}
async function bootTerminal(id,fast){
  term.classList.add('show');
  const steps=[...term.querySelectorAll('[data-step]')].sort((a,b)=>a.dataset.step-b.dataset.step);
  for(const p of steps){
    if(id!==runId)return;
    p.classList.add('go');
    p.querySelectorAll('.ty').forEach(el=>typeIn(el,fast));
    if(!fast)await wait(p.classList.contains('ch')?380:260);
  }
  if(!fast)await wait(900);
  if(id!==runId)return;
  ready=true;home.classList.add('ready');
}
function resetTerminal(){
  ready=false;home.classList.remove('ready');term.classList.remove('show');
  term.querySelectorAll('.go').forEach(p=>p.classList.remove('go'));
  term.querySelectorAll('.ty').forEach(el=>el.textContent='');
}

/* ---------- 전체 시퀀스 ---------- */
async function powerOn(fast){
  const id=++runId;resetTerminal();pixwrap.classList.remove('on');
  tv.classList.remove('on','off');void tv.offsetWidth;tv.classList.add('on');
  if(fast){noiseLevel=.04;return bootTerminal(id,true)}
  /* '움직임 줄이기' 설정이 켜져 있어도 오프닝은 항상 보여줌 (노이즈·흔들림만 빼고) */
  noiseLevel=reduce?0:.5;await wait(450);noiseLevel=reduce?0:.08;           /* CRT 켜짐 */
  await playPixel(id);if(id!==runId)return;                  /* 파란 픽셀 인트로 */
  if(!reduce)crt.classList.add('flick');noiseLevel=reduce?0:.6;await wait(220);  /* 신호 전환 */
  crt.classList.remove('flick');pixwrap.classList.remove('on');noiseLevel=reduce?0:.05;
  await bootTerminal(id,false);                              /* 주황 터미널 */
}
document.getElementById('skip').onclick=()=>powerOn(true);

/* ---------- 채널 선택 ---------- */
const chs=[...document.querySelectorAll('.ch')];
chs.forEach((c,i)=>{
  c.addEventListener('mouseenter',()=>chs.forEach(x=>x.classList.toggle('on',x===c)));
  c.addEventListener('click',()=>choose(c.dataset.go));
});
addEventListener('keydown',e=>{
  if(home.hidden||busy)return;
  if(!ready&&(e.key==='Enter'||e.key===' '||e.key==='Escape')){powerOn(true);return}
  if(ready&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const c=chs[e.key==='ArrowLeft'?0:1];c.focus();chs.forEach(x=>x.classList.toggle('on',x===c))}
});
async function choose(key){
  if(busy||!ready)return;busy=true;
  osd.textContent=PARTS[key].ch;osd.classList.add('show');
  crt.classList.add('flick');noiseLevel=.55;await wait(380);
  crt.classList.remove('flick');noiseLevel=0;
  tv.classList.add('off');await wait(560);          /* 브라운관 꺼짐 */
  osd.classList.remove('show');
  home.classList.add('zoom');await wait(450);        /* 방이 어두워짐 */
  location.hash=key;
}

/* ---------- 라우팅 ---------- */
let first=true;
function route(){
  const k=location.hash.slice(1),on=k in PARTS;
  home.hidden=on;
  for(const n in PARTS)document.getElementById(n).hidden=(n!==k);
  scrollTo(0,0);
  if(!on){
    home.classList.remove('zoom');osd.classList.remove('show');busy=false;
    powerOn(!first);
  }
  first=false;
}
addEventListener('hashchange',route);route();
</script>
