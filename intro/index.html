<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEOSEJI Intro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Noto+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen hero. Giant two-line name staggered left, small role note beside line one,
   a living dot field behind, minimal nav on top, scroll cue at the bottom. Single light look by choice. */
:root{
  --bg:#fbfbfb;        /* 배경 */
  --fg:#1e212d;        /* 글자 */
  --cursor:#ffa73e;    /* 마우스 포인터 */
  --cream:#f9f3cf;     /* 기타 포인트 */
  --muted:rgba(30,33,45,.62);
  --display:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--cream);color:var(--fg)}

/* 로딩 */
.loader{position:fixed;inset:0;z-index:50;background:var(--fg);display:grid;place-items:center;transition:transform .9s cubic-bezier(.77,0,.18,1)}
.loader.out{transform:translateY(-100%)}
.mark{width:26px;height:30px;background:var(--cream);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;left:50%;top:-10%;width:3px;height:120%;background:var(--fg);transform:translateX(-50%) rotate(-14deg)}
.loader .ltxt{color:var(--cream);font-family:var(--display);font-weight:500;font-size:clamp(14px,1.3vw,18px);letter-spacing:.32em;text-indent:.32em;white-space:nowrap}
/* 타이핑 */
.tw{position:relative;display:inline-block;text-indent:0}
.tw .ghost{visibility:hidden}
.tw .typed{position:absolute;left:0;top:0;white-space:nowrap}
.tw .typed .c{display:inline-block;white-space:pre;animation:cin .32s ease-out both}
@keyframes cin{from{opacity:0;transform:translateY(.25em)}}
.tw .typed::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.14em;background:currentColor;animation:caret .9s steps(1) infinite}
.tw.done .typed::after{animation:fadeout .4s .5s forwards}
@keyframes caret{50%{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes blink{50%{opacity:.25}}

/* 상단 */
.top{position:fixed;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px),2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.brand .mark{width:16px;height:19px;background:var(--fg)}
.brand .mark::after{width:2px;background:var(--cream)}
nav{display:flex;gap:clamp(14px,2vw,24px)}
nav a{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--fg);text-decoration:none;position:relative;padding:4px 0}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--cream);transform:scaleX(0);transform-origin:left;transition:transform .35s ease;z-index:-1}
nav a:hover::after,nav a:focus-visible::after{transform:scaleX(1)}
nav a:focus-visible,.brand:focus-visible{outline:2px solid var(--cursor);outline-offset:4px}

/* 히어로 */
.hero{position:relative;height:100%;overflow:hidden;touch-action:none}
.center{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:50%;
  transform:translateY(-58%);transition:transform 1.1s cubic-bezier(.2,.8,.15,1)}
.center.up{transform:translateY(calc(-58% - clamp(36px,7vh,80px)))}
.enter{position:absolute;left:0;right:0;top:calc(100% + clamp(36px,7vh,76px));display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(14px,3vw,40px);
  opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;pointer-events:none}
.enter.show{opacity:1;transform:none;pointer-events:auto}
.enter-btn{display:inline-block;background:var(--fg);color:var(--bg);font-family:var(--body);font-weight:500;font-size:clamp(14px,1.1vw,17px);letter-spacing:.02em;
  padding:13px clamp(18px,1.8vw,26px);text-decoration:none;border-radius:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.enter-btn:hover{transform:translateY(-5px);box-shadow:0 12px 24px rgba(30,33,45,.2)}
.enter-btn:active{transform:translateY(-2px)}
.enter-btn:focus-visible{outline:2px solid var(--cursor);outline-offset:4px}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}
.name{text-align:center;
  font-family:var(--display);font-weight:500;line-height:.9;margin:0}
.name .l{display:block;overflow:hidden;padding:.04em 0 .1em;font-size:clamp(40px,12vw,210px);letter-spacing:.06em;text-indent:.06em;white-space:nowrap}
.name .l>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s cubic-bezier(.2,.8,.15,1)}
.eyebrow{display:block;overflow:hidden;line-height:1.5;padding-bottom:.15em;font-size:clamp(13px,1.15vw,18px);letter-spacing:.32em;text-indent:.32em;font-weight:500;margin-bottom:clamp(6px,1.2vw,18px)}
.eyebrow>span{display:inline-block;transform:translateY(105%);transition:transform .9s .25s cubic-bezier(.2,.8,.15,1)}
.ready .eyebrow>span{transform:none}
.name .ch{display:inline-block;font-variation-settings:'wght' 400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ready .name .l>span{transform:none}
.row1{display:flex;align-items:flex-end;gap:clamp(10px,1.2vw,20px)}
.role{font-family:var(--body);font-size:clamp(14px,1.15vw,18px);line-height:1.38;letter-spacing:-.01em;font-weight:500;
  padding-bottom:.9em;white-space:nowrap;opacity:0;transform:translateY(8px);transition:opacity .8s .55s,transform .8s .55s}
.role em{font-style:normal;background:linear-gradient(transparent 52%,var(--cream) 52%);padding:0 2px}
.ready .role{opacity:1;transform:none}

.cue{position:absolute;z-index:2;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;
  background:var(--bg);padding:4px 8px;opacity:0;transition:opacity .8s .9s}
.ready .cue{opacity:1}
.cue b{font-weight:400;display:inline-block;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}

.meta{position:absolute;z-index:2;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  left:max(16px,env(safe-area-inset-left,0px),2.2vw);right:max(16px,env(safe-area-inset-right,0px),2.2vw);
  display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.meta span{background:var(--bg);padding:2px 4px}
.meta .ko{font-family:var(--body);letter-spacing:0;font-size:12px}

/* 커서 */
.cur,.ring{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%;opacity:0}
.cur{width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--cursor)}
.ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--cursor);transition:width .25s,height .25s,margin .25s,background .25s}
.ring.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(249,243,207,.55)}
@media (hover:hover) and (pointer:fine){body,a{cursor:none}.cur,.ring{opacity:1}}

@media (max-width:700px){
  .name .l{letter-spacing:.05em;text-indent:.05em}
  nav a.hide-sm{display:none}
  .meta span:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){
  .loader{display:none}
  .name .l>span,.eyebrow>span,.cue{transform:none!important;opacity:1!important;transition:none}
  .cue b{animation:none}
}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="loader" id="loader" aria-hidden="true"><div class="ltxt"><span class="tw"><span class="ghost">2026 PORTFOLIO</span><span class="typed" id="ltyped"></span></span></div></div>


<main class="hero" id="hero">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="center" id="center">
  <h1 class="name">
    <span class="eyebrow"><span>Editorial Designer</span></span>
    <span class="l"><span>SEO-SEJI</span></span>
  </h1>
  <div class="enter" id="enter">
    <a class="enter-btn" href="projects.html#work"><span class="tw"><span class="ghost">실무 프로젝트</span><span class="typed" data-text="실무 프로젝트"></span></span></a>
    <a class="enter-btn" href="projects.html#ai"><span class="tw"><span class="ghost">AI 개인 프로젝트</span><span class="typed" data-text="AI 개인 프로젝트"></span></span></a>
  </div>
  </div>
</main>

<div class="cur" id="cur"></div><div class="ring" id="ring"></div>

<script>
(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root=document.documentElement;
  const loader=document.getElementById('loader');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const typeInto=(el,text,speed)=>new Promise(res=>{let i=0;const step=()=>{
    if(i>=text.length){el.parentNode.classList.add('done');return res()}
    const s=document.createElement('span');s.className='c';s.textContent=text[i++];el.appendChild(s);setTimeout(step,speed)};step()});
  const enter=document.getElementById('enter'),center=document.getElementById('center');
  (async()=>{
    if(reduce){root.classList.add('ready');center.classList.add('up');enter.classList.add('show');
      enter.querySelectorAll('.typed').forEach(t=>{t.textContent=t.dataset.text;t.parentNode.classList.add('done')});return}
    await wait(250);await typeInto(document.getElementById('ltyped'),'2026 PORTFOLIO',85);
    await wait(550);loader.classList.add('out');await wait(250);root.classList.add('ready');
    await wait(1300);center.classList.add('up');
    await wait(650);enter.classList.add('show');
    await Promise.all([...enter.querySelectorAll('.typed')].map((t,i)=>wait(i*240).then(()=>typeInto(t,t.dataset.text,65))));
  })();

  /* 점 무늬 */
  const cv=document.getElementById('field'),ctx=cv.getContext('2d');
  const css=getComputedStyle(root);
  const FG=css.getPropertyValue('--fg').trim(),CREAM=css.getPropertyValue('--cream').trim(),ORANGE=css.getPropertyValue('--cursor').trim();
  let W=0,H=0,dpr=1,gap=9;
  const mouse={x:-999,y:-999,tx:-999,ty:-999,on:false};
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);gap=W<700?12:15}
  addEventListener('resize',size);size();

  function hash(i,j){let h=Math.imul(i,374761393)+Math.imul(j,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295}
  function vn(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
    const a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
  const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};

  let t=0;
  const rip=[],RV=240,RW=20,RL=2.8;let lastRip=0,lrx=-999,lry=-999;
  const addRip=(x,y,a)=>{rip.push({x,y,a,t:performance.now()/1000});if(rip.length>10)rip.shift()};
  function draw(){
    ctx.clearRect(0,0,W,H);
    mouse.x+=(mouse.tx-mouse.x)*.12;mouse.y+=(mouse.ty-mouse.y)*.12;
    const R=W<700?110:160;
    if(mouse.on){
      const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,R*1.15);
      g.addColorStop(0,CREAM);g.addColorStop(1,'rgba(249,243,207,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(mouse.x,mouse.y,R*1.15,0,Math.PI*2);ctx.fill();
    }
    const near=[];
    const now=performance.now()/1000;
    for(let i=rip.length-1;i>=0;i--)if(now-rip[i].t>RL)rip.splice(i,1);
    ctx.fillStyle='rgba(30,33,45,.32)';
    for(let y=gap*.5;y<H;y+=gap){
      const fade=ss(H*.3,H*.62,y);
      for(let x=gap*.5;x<W;x+=gap){
        let wv=0,rdx=0,rdy=0;
        for(let j=0;j<rip.length;j++){const r=rip[j],age=now-r.t,dx=x-r.x,dy=y-r.y,d=Math.hypot(dx,dy)||1,e=(d-age*RV)/RW;
          if(e<-2.6||e>2.6)continue;const a=Math.exp(-e*e)*(1-age/RL)*r.a;wv+=a;rdx+=dx/d*a;rdy+=dy/d*a}
        let show=false;
        if(fade>0){
          const wave=y*.011+Math.sin(x*.0052+t*.55)*1.3+Math.sin(x*.012-t*.35+y*.004)*.45+vn(x*.004+t*.05,y*.006)*.9;
          const band=((wave%1)+1)%1;
          const mask=ss(.28,.55,vn(x*.0018+t*.02+40,y*.0026));
          show=band<.32*fade*mask;
        }
        if(!show&&wv<.4)continue;
        let px=x+rdx*9,py=y+rdy*9,s=show?1.6+Math.min(wv,1)*1.4:1.1+Math.min(wv,1)*1.3;
        if(mouse.on){
          const dx=x-mouse.x,dy=y-mouse.y,d=Math.hypot(dx,dy);
          if(d<R){const k=(1-d/R)**2;px+=dx/(d||1)*k*16;py+=dy/(d||1)*k*16;s+=k*1.6;if(k>.35){near.push(px,py,s);continue}}
        }
        ctx.fillRect(px-s/2,py-s/2,s,s);
      }
    }
    if(near.length){ctx.fillStyle=ORANGE;for(let i=0;i<near.length;i+=3){const s=near[i+2];ctx.fillRect(near[i]-s/2,near[i+1]-s/2,s,s)}}
    if(!reduce){t+=.016;requestAnimationFrame(draw)}
  }
  draw();

  /* 커서 */
  const cur=document.getElementById('cur'),ring=document.getElementById('ring');
  let rx=-100,ry=-100,cx=-100,cy=-100,touchT=0;
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  addEventListener('pointermove',e=>{
    cx=e.clientX;cy=e.clientY;mouse.on=true;if(e.pointerType!=='mouse')touchT=performance.now();
    const r=cv.getBoundingClientRect();mouse.tx=cx-r.left;mouse.ty=cy-r.top;
    if(mouse.x<-500){mouse.x=mouse.tx;mouse.y=mouse.ty}
    const nw=performance.now();
    if(!reduce&&nw-lastRip>260&&Math.hypot(mouse.tx-lrx,mouse.ty-lry)>36){lastRip=nw;lrx=mouse.tx;lry=mouse.ty;addRip(mouse.tx,mouse.ty,1)}
    cur.style.transform=`translate(${cx}px,${cy}px)`;
    if(reduce)draw();
  });
  document.addEventListener('pointerleave',()=>{mouse.on=false;if(reduce)draw()});
  addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')dispatchEvent(new PointerEvent('pointermove',{clientX:e.clientX,clientY:e.clientY,pointerType:e.pointerType}))});
  (function loop(){rx+=(cx-rx)*.18;ry+=(cy-ry)*.18;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)})();
  document.querySelectorAll('a').forEach(a=>{
    a.addEventListener('pointerenter',()=>ring.classList.add('big'));
    a.addEventListener('pointerleave',()=>ring.classList.remove('big'));
  });

  /* Dynamic Weight: 커서에 가까운 글자일수록 굵게 (Originkit dynamic-weight 방식) */
  const nameEl=document.querySelector('.name .l>span');
  const label=nameEl.textContent;
  nameEl.innerHTML='<span class="sr">'+label+'</span>'+[...label].map(c=>'<span class="ch" aria-hidden="true">'+c+'</span>').join('');
  const chars=[...nameEl.querySelectorAll('.ch')],fac=chars.map(()=>0),FROM=400,TO=900;
  let fs=parseFloat(getComputedStyle(nameEl).fontSize),lastF=0;
  addEventListener('resize',()=>{fs=parseFloat(getComputedStyle(nameEl).fontSize)});
  if(!reduce)(function weights(nowT){
    const dt=Math.min(.1,Math.max(0,(nowT-(lastF||nowT))/1000));lastF=nowT;
    const a=1-Math.exp(-dt/.3),reach=Math.max(200,fs*1.6);
    let qx=cx,qy=cy;
    /* 터치 기기: 손가락을 떼면 가상의 포인터가 이름 위를 천천히 오가며 효과를 보여 줌 */
    if(!fine&&root.classList.contains('ready')&&performance.now()-touchT>1500){
      const b=nameEl.getBoundingClientRect(),ph=nowT/1000;
      qx=b.left+b.width*(.5+.5*Math.sin(ph*.8));qy=b.top+b.height*.5;
      const rc=cv.getBoundingClientRect();mouse.on=true;mouse.tx=qx-rc.left;mouse.ty=qy-rc.top;
    }
    for(let i=0;i<chars.length;i++){
      const r=chars[i].getBoundingClientRect(),d=Math.hypot(qx-(r.left+r.width/2),qy-(r.top+r.height/2));
      const tg=Math.min(Math.max(1-d/reach,0),1);fac[i]+=(tg-fac[i])*a;
      chars[i].style.fontVariationSettings="'wght' "+Math.round(FROM+(TO-FROM)*fac[i]);
    }
    requestAnimationFrame(weights);
  })(performance.now());
})();
</script>
</body>
</html>
