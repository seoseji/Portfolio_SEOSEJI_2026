<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEOSEJI Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: editorial index. Big uppercase title with a short lead on the right, a numbered media index,
   then each medium as a two-column band (sticky label left, works right). Same two colours as the intro. */
:root{
  --bg:#fbfbfb;--fg:#1e212d;--cursor:#ffa73e;--cream:#f9f3cf;
  --muted:rgba(30,33,45,.56);--line:rgba(30,33,45,.14);--soft:#f1f1ef;
  --display:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px),2.6vw);--gxr:max(16px,env(safe-area-inset-right,0px),2.6vw);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:var(--cream)}
img,video{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
.gx{padding-left:var(--gx);padding-right:var(--gxr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}

/* 상단 바 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,251,251,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px;border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.home{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.16em;text-decoration:none;white-space:nowrap}
.switch{display:flex;gap:clamp(12px,2vw,28px);font-size:13.5px}
.switch a{text-decoration:none;color:var(--muted);position:relative;padding:2px 0;transition:color .2s}
.switch a.on,.switch a:hover{color:var(--fg)}
.switch a.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1.5px;background:var(--fg)}

/* 타이틀 */
.hero{display:grid;grid-template-columns:1fr minmax(0,330px);align-items:end;gap:24px 48px;padding-block:clamp(56px,11vh,120px) clamp(40px,7vh,72px)}
.eyebrow{font-family:var(--display);font-size:clamp(13px,1.05vw,16px);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:0 0 .2em .04em}
.title{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(48px,9.6vw,158px);line-height:.84;letter-spacing:.005em;margin:0;white-space:nowrap}
.lead{margin:0 0 .5em;font-size:15px;line-height:1.6;color:rgba(30,33,45,.8);text-wrap:pretty}

/* 목차 */
.index{position:sticky;top:calc(var(--tbH,54px) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);border-top:1px solid var(--fg);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-inline:calc(-1 * var(--gx)) calc(-1 * var(--gxr));padding-inline:var(--gx) var(--gxr)}
.index a{display:flex;gap:10px;align-items:baseline;padding:14px 12px 14px 0;text-decoration:none;font-size:15px;font-weight:500;color:var(--muted);transition:padding .25s,color .25s}
.index a.on,.index a:hover{color:var(--fg)}
.index a.on span{color:var(--cursor)}
.index{transition:background-color .3s,border-color .3s}
.index.stuck{background:rgba(30,33,45,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top-color:transparent;border-bottom-color:transparent}
.index.stuck a{color:rgba(251,251,251,.62)}
.index.stuck a span{color:rgba(251,251,251,.42)}
.index.stuck a.on,.index.stuck a:hover{color:var(--bg)}
.index.stuck a.on span{color:var(--cursor)}
.index a span{font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.index a:hover{padding-left:6px}

/* 매체 구간 */
.medium{display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr);gap:28px clamp(24px,4vw,64px);padding-block:clamp(56px,9vh,96px) 8px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--tbH,54px) + var(--ixH,50px))}
.m-label{align-self:start;position:sticky;top:calc(var(--tbH,54px) + var(--ixH,50px) + 24px + env(safe-area-inset-top,0px))}
.work.center .g,.work.center .vid,.work.center .long{margin-inline:auto}
.work.center .long-hint{text-align:center}
.m-no{font-family:var(--display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.m-en{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:0}
.spec.no-time{grid-template-columns:minmax(0,1.1fr) minmax(0,3.1fr)}
.m-label h2{font-size:clamp(34px,3.4vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:4px 0 0 -.05em}
.work .w-head h3{line-height:1.2}
.m-label p{margin:14px 0 0;color:var(--muted);font-size:14.5px;word-break:keep-all}
.works{min-width:0}
.work{padding-bottom:clamp(48px,7vh,80px)}
.work+.work{padding-top:clamp(40px,6vh,64px);border-top:1px solid var(--line)}
.w-head{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.w-head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.35;flex:none;max-width:80%}.spec{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.7fr) minmax(0,2.4fr);gap:16px 28px;margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.spec div{min-width:0}
.spec dt{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.spec dd{margin:0;font-size:14.5px;line-height:1.6}
/* TOOL 공식 로고 아이콘: 마우스를 올리면(휴대폰은 누르면) 이름 */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:2px}
.tic{width:28px;height:28px;display:grid;place-items:center;position:relative;flex:none;cursor:default}
.tic img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}
.tic:hover img{transform:translateY(-2px)}
.tic::after{content:attr(data-name);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);white-space:nowrap;background:var(--fg);color:var(--bg);
  font-family:var(--body);font-weight:500;font-size:12px;line-height:1.5;padding:3px 8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
.tic:hover::after,.tic:focus-visible::after,.tic.show::after{opacity:1;transform:translate(-50%,0)}
.tic:focus-visible{outline:2px solid var(--cursor);outline-offset:3px}

/* 갤러리 */
.g{display:grid;gap:clamp(8px,1vw,14px)}
.zoom{display:block;width:100%;padding:0;border:0;background:var(--soft);cursor:zoom-in;overflow:hidden;position:relative}
.zoom img{width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.zoom:hover img{transform:scale(1.025)}
.zoom:focus-visible{outline:2px solid var(--cursor);outline-offset:3px}
.cap{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
figure{margin:0;min-width:0}
.g.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g.end{align-items:end}
.g.c8{grid-template-columns:repeat(8,minmax(0,1fr));align-items:end}
.g .full{grid-column:1/-1}
.crop45 img{aspect-ratio:4/5;object-fit:cover}
.crop11 img{aspect-ratio:1;object-fit:cover}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;gap:clamp(8px,1vw,14px);align-items:flex-start}
.row figure{flex:var(--r) 1 0}
.minis{grid-template-columns:repeat(2,minmax(0,280px));justify-content:center}
.vid{background:#000}
.vid video{width:100%;height:auto}
.vid.vert{max-width:380px}
.long{width:min(400px,100%);height:min(680px,78vh);overflow-y:auto;border:1px solid var(--line);background:var(--soft);position:relative;overscroll-behavior:contain}
.long .inner{position:relative}
.long .inner>img{width:100%;height:auto}
.long .gif{position:absolute;object-fit:cover}
.long-hint{font-size:12.5px;color:var(--muted);margin-top:10px}

/* 다음 */
.next{display:flex;justify-content:space-between;align-items:end;gap:24px;padding-block:clamp(64px,12vh,140px) clamp(40px,6vh,64px)}
.next a{text-decoration:none;display:block}
.next small{display:block;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.next .big{font-family:var(--display);text-transform:uppercase;font-size:clamp(36px,6vw,96px);line-height:.9;letter-spacing:-.04em;transition:letter-spacing .4s}
.next a:hover .big{letter-spacing:-.02em}
.next .back{font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap}
.next .back:hover{color:var(--fg)}

/* 크게 보기 */
#lb[hidden]{display:none}
#lb{position:fixed;inset:0;z-index:50;background:rgba(251,251,251,.97);display:grid;place-items:center;padding:clamp(16px,4vw,56px);cursor:zoom-out}
#lb img{max-height:calc(100vh - 2*clamp(16px,4vw,56px));width:auto;max-width:100%;object-fit:contain;box-shadow:0 20px 60px rgba(30,33,45,.12)}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(var(--gxr));border:0;background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;cursor:pointer}

/* 커서 (노란 번짐 없이 점과 테두리만) */
.cur,.ring{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:50%;opacity:0}
.cur{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--cursor)}
.ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--cursor);transition:width .25s,height .25s,margin .25s}
.ring.big{width:58px;height:58px;margin:-29px 0 0 -29px}
@media (hover:hover) and (pointer:fine){html,a,button,.zoom{cursor:none}.cur,.ring{opacity:1}}

a:focus-visible,button:focus-visible{outline:2px solid var(--cursor);outline-offset:3px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .medium{grid-template-columns:1fr}
  .m-label{position:static}
  .m-label p{max-width:none}
  .index{display:flex;overflow-x:auto;scrollbar-width:none;gap:22px}
  .index::-webkit-scrollbar{display:none}
  .index a{flex:0 0 auto;padding:12px 0;font-size:14px;white-space:nowrap}
  .g.c6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g.c8{grid-template-columns:repeat(4,minmax(0,1fr))}
  .spec,.spec.no-time{grid-template-columns:1fr 1fr}
  .spec .pt{grid-column:1/-1}
}
@media (max-width:560px){
  .switch{font-size:12.5px}
  .title{font-size:min(48px,10.8vw)}
  .g.c3,.g.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g.c2.flyers,.g.c2.cards,.g.c2.stickers{grid-template-columns:1fr}
  .row{flex-wrap:wrap}.row figure{flex-basis:100%}
  .next{flex-direction:column;align-items:flex-start}
}
</style>
</head>

const u=s=>BASE+s;

const TOOL_ICON={'Photoshop':'photoshop.svg','Illustrator':'illustrator.svg','Premiere Pro':'premiere.svg','Figma':'figma.svg',
  'Firefly':'firefly.svg','Higgsfield':'higgsfield.png','Suno':'suno.svg','Claude':'claude.svg'};
const toolIcons=t=>t?`<div class="tools">${t.split(',').map(s=>s.trim()).map(n=>TOOL_ICON[n]
  ?`<span class="tic" tabindex="0" role="img" aria-label="${n}" data-name="${n}"><img src="icons/${TOOL_ICON[n]}" alt=""></span>`
  :`<span>${n}</span>`).join('')}</div>`:'-';
const esc=s=>String(s).replace(/"/g,'&quot;');
const Z=(s,label,cls='')=>`<button class="zoom ${cls}" data-full="${u(s)}" aria-label="${esc(label)} 크게 보기"><img src="${u(s)}" alt="" loading="lazy"></button>`;
const fig=(s,label,cap)=>`<figure>${Z(s,label)}${cap?`<figcaption class="cap">${cap}</figcaption>`:''}</figure>`;

function gallery(it){
  const n=(i)=>`${it.title} ${i+1}`;
  switch(it.kind){
    case 'stand':{const c=it.units.length>=8?'c8':'c4';
      return `<div class="g ${c}">${it.units.map(([,s],i)=>Z(s,n(i))).join('')}</div>`}
    case 'hang':
      if(it.layout==='mix')return `<div class="row">${it.hangs.map(h=>`<figure style="--r:${h.r}">${Z(h.s,h.label)}<figcaption class="cap">${h.label}</figcaption></figure>`).join('')}</div>`;
      return `<div class="g c2 end">${it.hangs.map(h=>`<figure class="${h.r>3?'full':''}">${Z(h.s,h.label)}<figcaption class="cap">${h.label}</figcaption></figure>`).join('')}</div>`;
    case 'site':return `<div class="g c2">${it.slides.map((s,i)=>Z(s,`롤링배너 ${i+1}`)).join('')}</div>`;
    case 'popup':return `<div class="g c3">${it.slides.map((s,i)=>Z(s,`팝업배너 ${i+1}`)).join('')}</div>`;
    case 'flyers':return `<div class="g c2 flyers">${it.flyers.map(x=>`<figure class="${x.cls==='wide'?'full':''}"><div class="pair">${Z(x.f,x.t+' 앞면')}${Z(x.b,x.t+' 뒷면')}</div><figcaption class="cap">${x.t} · 앞면 / 뒷면</figcaption></figure>`).join('')}</div>`;
    case 'feed':return `<div class="g c6">${it.imgs.map((s,i)=>Z(s,n(i),'crop45')).join('')}</div>`;
    case 'thumbs':return `<div class="g c6">${it.imgs.map((s,i)=>Z(s,n(i),'crop11')).join('')}</div>`;
    case 'posters':return `<div class="g c4">${it.imgs.map((s,i)=>Z(s,n(i))).join('')}</div>`;
    case 'cards':return `<div class="g c2 cards">${it.cards.map(c=>`<figure><div class="pair">${Z(c.f,c.t+' 앞면')}${Z(c.b,c.t+' 뒷면')}</div><figcaption class="cap">${c.t}</figcaption></figure>`).join('')}</div>`;
    case 'stickers':return `<div class="g c2 stickers">${it.imgs.map((s,i)=>Z(s,n(i))).join('')}</div>`;
    case 'minis':return `<div class="g minis">${it.imgs.map((s,i)=>Z(s,n(i))).join('')}</div>`;
    case 'avideo':{const v=it.ratio==='9/16';
      return `<div class="vid ${v?'vert':''}"><video controls playsinline preload="metadata" poster="${u(it.poster)}" aria-label="${esc(it.title)}"><source src="${u(it.src)}" type="video/mp4"></video></div>`}
    case 'adetail':{const g=it.gif;
      return `<div class="long" tabindex="0" aria-label="${esc(it.title)}, 위아래로 스크롤해서 보기"><div class="inner"><img src="${u(it.img)}" alt="${esc(it.title)}" loading="lazy">${g?`<img class="gif" src="${u(g.src)}" alt="" loading="lazy" style="left:${g.x/g.W*100}%;top:${g.y/g.H*100}%;width:${g.w/g.W*100}%;height:${g.h/g.H*100}%">`:''}</div></div><p class="long-hint">상자 안을 위아래로 스크롤해 보세요 · 이미지를 누르면 크게 보기</p>`}
    case 'agal':return `<div class="row">${it.imgs.map(([s,l,r])=>`<figure style="--r:${r.toFixed(3)}">${Z(s,it.title+' '+l)}<figcaption class="cap">${l}</figcaption></figure>`).join('')}</div>`;
  }
  return '';
}
const subOf=it=>(it.sub||'').replace(/\s*—\s*.*$/,'');

function render(){
  const id=location.hash.slice(1)==='ai'?'ai':'work',pg=PAGES[id],P=PARTS[pg.key],O=PAGES[pg.other],OP=PARTS[O.key];
  document.title=`SEOSEJI ${pg.title}`;
  document.getElementById('sw-work').classList.toggle('on',id==='work');
  document.getElementById('sw-ai').classList.toggle('on',id==='ai');
  const tot=String(P.order.length).padStart(2,'0');
  document.getElementById('page').innerHTML=`
  <section class="hero">
    <div><h1 class="title">${pg.title}</h1></div>
    <p class="lead">${P.lead}</p>
  </section>
  <nav class="index" aria-label="매체 목차">${P.order.map((m,i)=>`<a href="#${id}-${m}" data-to="${id}-${m}"><span>${String(i+1).padStart(2,'0')}</span>${MEDIA[m].ko}</a>`).join('')}</nav>
  ${P.order.map((m,mi)=>`
  <section class="medium" id="${id}-${m}">
    <div class="m-label"><div class="m-en">${id==='work'?`Project ${String(mi+1).padStart(2,'0')}`:MEDIA[m].en}</div><h2>${MEDIA[m].ko}</h2>${SHORT[m]?`<p>${SHORT[m]}</p>`:''}</div>
    <div class="works">${P.items.filter(i=>i.m===m).map(it=>`
      <article class="work ${it.kind==='minis'||it.kind==='adetail'||(it.kind==='avideo'&&it.ratio==='9/16')?'center':''}">
        <div class="w-head"><h3>${it.title}</h3></div>
        ${gallery(it)}
        <dl class="spec${it.time?'':' no-time'}">
          <div><dt>Tool</dt><dd>${toolIcons(it.tool)}</dd></div>
          ${it.time?`<div><dt>Time</dt><dd>${it.time}</dd></div>`:''}
          <div class="pt"><dt>Point</dt><dd>${it.point}</dd></div>
        </dl>
      </article>`).join('')}</div>
  </section>`).join('')}
  <section class="next">
    <a href="#${pg.other}"><small>Next · ${OP.name}</small><span class="big">${O.title} →</span></a>
    <a class="back" href="./">← 인트로로 돌아가기</a>
  </section>`;
  document.querySelectorAll('[data-to]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.to).scrollIntoView()}));
  bindRing();
  alignLabels();
}
/* 왼쪽 매체 이름의 글자 윗선을 오른쪽 첫 작업 제목의 글자 윗선에 맞춤 (두 칸일 때만)
   스크롤 중 붙어 있는(sticky) 상태에서 재면 값이 틀어지므로 잠깐 풀고 잰다 */
const glyphTop=el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el),fs=parseFloat(cs.fontSize),lh=parseFloat(cs.lineHeight)||fs*1.2;return r.top+(lh-fs)/2+fs*.09};
function alignLabels(){
  document.querySelectorAll('.medium').forEach(sec=>{
    const lab=sec.querySelector('.m-label'),h2=lab.querySelector('h2'),h3=sec.querySelector('.w-head h3');
    lab.style.marginTop='0px';lab.style.position='static';
    if(h3&&lab.offsetWidth<sec.clientWidth*.6){
      const d=glyphTop(h2)-glyphTop(h3);
      lab.style.marginTop=(-d)+'px';
    }
    lab.style.position='';
  });
}
addEventListener('resize',alignLabels);
document.fonts&&document.fonts.ready.then(alignLabels);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='work'||h==='ai'){render();scrollTo(0,0)}});
render();

/* 상단 바 선 */
const tb=document.getElementById('topbar');
/* 목차가 상단 바에 붙으면 어두운 배경으로 */
const stick=()=>{tb.classList.toggle('scrolled',scrollY>8);const ix=document.querySelector('.index');
  if(ix)ix.classList.toggle('stuck',ix.getBoundingClientRect().top<=tb.offsetHeight+1)};
addEventListener('scroll',stick,{passive:true});addEventListener('hashchange',()=>setTimeout(stick,0));
/* 상단 바 · 목차 높이 → 목차가 상단 바 바로 밑에 붙음 */
const setH=()=>{const r=document.documentElement.style,ix=document.querySelector('.index');r.setProperty('--tbH',tb.offsetHeight+'px');if(ix)r.setProperty('--ixH',ix.offsetHeight+'px')};
addEventListener('resize',setH);setH();
/* 지금 보고 있는 매체를 목차에 표시 */
let io=null;
function watch(){
  io&&io.disconnect();setH();
  const links=[...document.querySelectorAll('.index a')];
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.to===e.target.id))})},{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('.medium').forEach(s=>io.observe(s));
}
watch();addEventListener('hashchange',()=>setTimeout(watch,0));

/* 크게 보기 */
const lb=document.getElementById('lb'),lbImg=lb.querySelector('img');let lbFrom=null;
const closeLb=()=>{lb.hidden=true;lbImg.removeAttribute('src');lbFrom&&lbFrom.focus()};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-full]');
  if(b){lbFrom=b;lbImg.src=b.dataset.full;lbImg.alt=b.getAttribute('aria-label')||'';lb.hidden=false;document.getElementById('lb-close').focus();return}
  if(!lb.hidden&&e.target.closest('#lb'))closeLb();
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!lb.hidden)closeLb()});
/* 상세페이지 상자: 누르면 크게 */
document.addEventListener('click',e=>{const l=e.target.closest('.long .inner>img:not(.gif)');if(l){lbFrom=l.closest('.long');lbImg.src=l.src;lb.hidden=false}});

/* 휴대폰: 로고를 누르면 이름이 뜨고, 다른 곳을 누르면 사라짐 */
document.addEventListener('click',e=>{const t=e.target.closest('.tic');
  document.querySelectorAll('.tic.show').forEach(x=>{if(x!==t)x.classList.remove('show')});
  if(t)t.classList.toggle('show')});
/* 커서 */
const cur=document.getElementById('cur'),ring=document.getElementById('ring');
let cx=-100,cy=-100,rx=-100,ry=-100;
addEventListener('pointermove',e=>{cx=e.clientX;cy=e.clientY;cur.style.transform=`translate(${cx}px,${cy}px)`});
(function loop(){rx+=(cx-rx)*.2;ry+=(cy-ry)*.2;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)})();
function bindRing(){document.querySelectorAll('a,button,video,.long').forEach(el=>{if(el.dataset.rb)return;el.dataset.rb=1;
  el.addEventListener('pointerenter',()=>ring.classList.add('big'));el.addEventListener('pointerleave',()=>ring.classList.remove('big'))})}
bindRing();
</script>
</body>
</html>
